- type: entity
  abstract: true
  id: BaseSpeciesLayers
  components:
  - type: Sprite
    layers:
    # Torso
    - map: [ "enum.HumanoidVisualLayers.TailBehind" ] # Floofstation
    - map: [ "enum.HumanoidVisualLayers.Chest" ]

    # Head
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]

    # Limbs
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]

    # Underwear & clothing
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    # - map: ["jumpsuit"] # Floof - below

    # Extremities
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    # Floof - below
    # - map: ["enum.HumanoidVisualLayers.LHand"]
    # - map: ["enum.HumanoidVisualLayers.RHand"]

    # Begin Euphoria changes - clothing undergarments
    - map: [ "undergarmentSocks" ]
    - map: [ "undergarmentTop" ]
    - map: [ "undergarmentBottom" ]

    - map: [ "shoes" ] # moved above jumpsuit
    - map: [ "jumpsuit" ] # moved below hands and feet

    - map: ["enum.HumanoidVisualLayers.LHand"] # moved to keep above jumpsuit (feet are intentionally kept below it)
    - map: ["enum.HumanoidVisualLayers.RHand"] # ^
    # End Euphoria changes

    # Stuff that goes over the body but below equipment
    - map: ["enum.HumanoidVisualLayers.Overlay"]

    # More equipment
    - map: [ "gloves" ]
    # - map: [ "shoes" ] # Floof - above
    - map: [ "ears" ]
    - map: [ "eyes" ]
    # - map: [ "belt" ] # Floof - below
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "enum.HumanoidVisualLayers.TailOversuit" ] # Floofstation - some tails may want to draw over outer clothing
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: [ "suitstorage" ]

    # Stuff that goes in front of equipment
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Wings" ] # Euphoria: Wings under tails
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.TailOverlay" ]
    - map: [ "enum.HumanoidVisualLayers.NeckFluff" ] # Delta V - Neck Fluff Mapping

    # Stuff that goes in front of stuff that goes in front of equipment
    - map: [ "mask" ]
    - map: [ "belt" ] # Euphoria: Move the belt slot down the chain
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]

    # Extra stuff
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false

    - map: [ "clownedon" ] # Dynamically generated
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false

    # Delta V - Harpy Wings
    - map: [ "enum.HumanoidVisualLayers.RArmExtension" ]
    - map: [ "enum.HumanoidVisualLayers.LArmExtension" ]

- type: entity
  id: BaseSpeciesAppearance
  parent:
  - InventoryBase
  - BaseSpeciesLayers
  abstract: true
  save: false
  components:
  - type: Body
  - type: VisualBody
  - type: Hands
  - type: ComplexInteraction
  - type: ContainerContainer
  - type: Appearance
  - type: HideableHumanoidLayers
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: OfferItem # Floofstation
