- type: entity
  id: OrganRatLungs
  parent: OrganHumanLungs
  suffix: "rat"
  components:
  - type: Metabolizer
    metabolizerTypes: [ Rat ]

- type: entity
  id: OrganRatStomach
  parent: OrganAnimalStomach
  suffix: "rat"
  components:
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Sprite
    state: stomach

- type: entity # Euphoria - Rodentia can eat more at once due to their hunger rate
  id: OrganRodentiaStomach
  parent: OrganRatStomach
  suffix: "rodentia"
  components:
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
