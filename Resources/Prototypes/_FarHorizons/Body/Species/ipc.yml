# Organs

- type: entity
  parent: OrganBase
  id: OrganIPC
  abstract: true
  suffix: IPC
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Oil
        Quantity: 10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Oil
          Quantity: 10

- type: entity
  parent: OrganIPC
  id: OrganIPCInternal
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/IPC/organs.rsi
  - type: Icon # Euph - also specify the icon path
    sprite: _FarHorizons/Mobs/Species/IPC/organs.rsi

# We dont have visualorgan, visualorganmarkings, limbdamageeffect, organemptarget
- type: entity
  parent: OrganIPC
  id: OrganIPCExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/IPC/parts.rsi
  - type: Icon # Euph - also specify the icon path
    sprite: _FarHorizons/Mobs/Species/IPC/parts.rsi
