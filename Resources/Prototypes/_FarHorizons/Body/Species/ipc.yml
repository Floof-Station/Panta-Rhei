# Euph - pre-nubody version
- type: body
  id: IPC
  name: ipc
  root: torso
  slots:
    head:
      part: OrganIPCHead
      connections:
      - torso
      organs: # brain isn't part of the body
        eyes: OrganIPCEyes
    torso:
      part: OrganIPCTorso
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        heart: OrganIPCHeart
    right arm:
      part: OrganIPCArmRight
      connections:
      - right hand
    left arm:
      part: OrganIPCArmLeft
      connections:
      - left hand
    right hand:
      part: OrganIPCHandRight
    left hand:
      part: OrganIPCHandLeft
    right leg:
      part: OrganIPCLegRight
      connections:
      - right foot
    left leg:
      part: OrganIPCLegLeft
      connections:
      - left foot
    right foot:
      part: OrganIPCFootRight
    left foot:
      part: OrganIPCFootLeft

# Pre-nubody doesn't have OrganBase, we alias it to human organ
