- type: species
  id: IPC
  name: species-name-ipc
  roundStart: true
  prototype: MobIPC
  sprites: MobIPCSprites
  markingLimits: MobIPCMarkingLimits
  dollPrototype: MobIPCDummy
  skinColoration: Hues
  minAge: 18 #Euphoria
  maxAge: 240
  oldAge: 50
  youngAge: 50
  maleFirstNames: IpcFirst
  femaleFirstNames: IpcFirst
  lastNames: IpcLast
  naming: FirstDashLast
  sexes:
  - Unsexed

- type: speciesBaseSprites
  id: MobIPCSprites
  sprites:
    Head: MobIPCHead
    Snout: MobHumanoidAnyMarking
    Chest: MobIPCTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    LArm: MobIPCLArm
    RArm: MobIPCRArm
    LHand: MobIPCLHand
    RHand: MobIPCRHand
    LLeg: MobIPCLLeg
    RLeg: MobIPCRLeg
    LFoot: MobIPCLFoot
    RFoot: MobIPCRFoot
    # Begin Euphoria Additions
    SnoutCover: MobHumanoidAnyMarking
    Eyes: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    TailBehind: MobHumanoidAnyMarking
    TailOversuit: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Wings: MobHumanoidAnyMarking
    Face: MobHumanoidAnyMarking
    # End Euphoria Additions

- type: markingPoints
  id: MobIPCMarkingLimits
  points:
    HeadTop:
      points: 2
      required: true
    Hair:
      points: 1 # Euphoria - Previously 2 for some reason.
      required: false
    FacialHair:
      points: 1 # Euphoria - Same problem as hair
      required: false
    Head:
      points: 6
      required: true
      defaultMarkings: [ MobIPCHeadStandard ]
    HeadSide:
      points: 6
      required: false
    Chest:
      points: 10
      required: true
      defaultMarkings: [ MobIPCTorsoStandard ]
    Legs:
      points: 24
      required: true
      defaultMarkings: [ MobIPCLLegStandard, MobIPCLFootStandard, MobIPCRLegStandard, MobIPCRFootStandard ]
    Arms:
      points: 24
      required: false
      defaultMarkings: [ MobIPCLArmStandard, MobIPCLHandStandard, MobIPCRArmStandard, MobIPCRHandStandard ]
    # Euphoria start
    Snout: # DeltaV - Adds ability to use more marking types
      points: 1
      required: false
    SnoutCover:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    Eyes: # DeltaV - Moves screen to the eyes layer
      points: 10
      required: false
    Special:
      points: 1
      required: false
    Face:
      points: 10
      required: false
    Wings:
      points: 1
      required: false
    Tail:
      points: 1
      required: false
  # Euphoria End

- type: humanoidBaseSprite
  id: MobIPCEyes
  baseSprite:
    sprite: _FarHorizons/Mobs/Species/IPC/parts.rsi
    state: light

- type: humanoidBaseSprite
  id: MobIPCAnyMarking

- type: humanoidBaseSprite
  id: MobIPCMarkingMatchSkin
  markingsMatchSkin: true
