- type: marking
  id: BustyBreasts
  bodyPart: Undershirt
  markingCategory: Undershirt
  coloring:
    default:
      type:
        !type:SkinColoring
    layers:
      busty_breasts:
        type:
          !type:SkinColoring
      busty_nipples:
        type:
          !type:SimpleColoring
            color: "#f29835"
  sprites:
