- type: entity
  parent: ClothingOuterEVASuitSyndicate
  id: ClothingOuterHardsuitRoboNeurotisist
  name: robo-neuroticist softshell suit
  description: "Dramatic cape, stylish collar, and packed to the gills with life support tech'"
  components:
  - type: Sprite
    sprite: _DV/Clothing/OuterClothing/Suits/eva_roboneuroticist.rsi
  - type: Clothing
    sprite: _DV/Clothing/OuterClothing/Suits/eva_roboneuroticist.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetRoboNeuroticist
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot { }
      toggleable-under-clothing: !type:ContainerSlot {}
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.2 # Little easier to steal the core when you have a rad suit
        Heat: 0.75 # Take an extra shot or two
  - type: ClothingSpeedModifier # Make em a bit more nimble so they can hide/Run
    walkModifier: 1
    sprintModifier: 1

# Departmental EVA Suits
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitEVAScience
  name: NT-32 - "Satyr" EVA Suit
  description: A modified EVA suit produced by NanoTrasen specifically for the Epistemics Department. Its tags indicate that it will protect for from moderate radiation exposure and lightly from chemical spills and explosions. It feels somewhat light.
  components:
  - type: Sprite
    sprite: _DV/Clothing/OuterClothing/Suits/eva_epistemics.rsi
  - type: Clothing
    sprite: _DV/Clothing/OuterClothing/Suits/eva_epistemics.rsi
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.6
        Caustic: 0.8 # Wouldn't want John Scientist getting obliterated by the funny caustic chem artifact.
  - type: ExplosionResistance
    damageCoefficient: 0.7 # Practically a budget bombsuit, so it absorbs a lot of explosion damage.
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon
    - HidesHarpyWings

#Engineering Void Suit
- type: entity
  parent: [ClothingOuterEVASuitBase, BaseEngineeringContraband]
  id: ClothingOuterVoidsuitEngineering
  name: HpI-19EV - "Lampsi Lite" Voidsuit
  description: A lightweight version of the HpI-19E hardsuit. Allows for faster response time, at the cost of most of the protective plating. The tags on the suit indicate it's rated for moderate radiation exposure. It feels light.
  components:
  - type: Sprite
    sprite: _DV/Clothing/OuterClothing/Suits/engineering-light.rsi
    state: icon
  - type: Clothing
    sprite: _DV/Clothing/OuterClothing/Suits/engineering-light.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
      outerClothing-harpy:
      - state: equipped-OUTERCLOTHING-harpy
      - state: equipped-OUTERCLOTHING-unshaded-harpy
        shader: unshaded
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-vox
      - state: equipped-OUTERCLOTHING-unshaded-vox
        shader: unshaded
      outerClothing-reptilian:
      - state: equipped-OUTERCLOTHING-reptilian
      - state: equipped-OUTERCLOTHING-unshaded-reptilian
        shader: unshaded
      outerClothing-dog:
      - state: equipped-OUTERCLOTHING-dog
      - state: equipped-OUTERCLOTHING-unshaded-dog
        shader: unshaded
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.5
        Heat: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetVoidsuitEngineering
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      toggleable-under-clothing: !type:ContainerSlot {}
  - type: Tag
    tags:
    - CorgiWearable
    - Hardsuit
    - WhitelistChameleon
    - HidesHarpyWings
