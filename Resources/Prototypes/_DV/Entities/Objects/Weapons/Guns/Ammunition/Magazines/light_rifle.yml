# .30 rifle

- type: entity
  parent: BaseMagazineLightRifle
  id: MagazineLightRifleRubber
  name: magazine (.30 rifle rubber)
  description: Curved 30-round double stack magazine for combat rifles. Intended to hold less-lethal rubber ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeLightRifleRubber
  - type: Sprite
    layers:
    - state: rubber
      sprite: _DV/Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  # Euphoria start: Fix rubber magazine variant visuals
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#206eef"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#206eef"
  # Euphoria end
