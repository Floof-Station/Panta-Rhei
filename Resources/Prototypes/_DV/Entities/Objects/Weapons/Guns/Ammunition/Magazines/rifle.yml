# .20 rifle

- type: entity
  parent: BaseMagazineRifle
  id: MagazineRifleRubber
  name: magazine (.20 rifle rubber)
  description: 25-round double stack magazine for combat rifles. Intended to hold less-lethal rubber ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleRubber
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#206eef" # Euphoria: Fix rubber magazine variant visuals (#206eef<#dbdbdb)
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      # Euphoria start: Fix rubber magazine variant visuals
      - state: inhand-left-stripe
        color: "#206eef"
      # Euphoria end
      right:
      - state: inhand-right-mag
      # Euphoria start: Fix rubber magazine variant visuals
      - state: inhand-right-stripe
        color: "#206eef"
      # Euphoria end
