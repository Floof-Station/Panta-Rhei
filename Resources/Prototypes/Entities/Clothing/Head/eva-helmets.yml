#Paramedic Void Helmet
- type: entity
  parent: [ ClothingHeadSuitWithLightBase, ClothingHeadEVAHelmetBase ] #Despite acting like a hardsuit helmet, since it inherits from EVA Helmet, it goes here.
  id: ClothingHeadHelmetVoidParamed
  name: ZhP-24M Helmet
  description: A voidsuit helmet for the ZhP-24M. It has wings painted on the sides.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Clothing/Head/Hardsuits/paramedhelm.rsi
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
      head-vox:
      - state: equipped-head-light-vox
      head-vulpkanin: # DeltaV - add modified vulp helmet
      - sprite: _DV/Clothing/Head/Hardsuits/paramedhelm.rsi
        state: equipped-head-light-vulpkanin
      head-feroxi: # DeltaV - add modified feroxi helmet
      - sprite: _DV/Clothing/Head/Hardsuits/paramedhelm.rsi
        state: equipped-head-light-feroxi
      head-dog:
      - state: equipped-head-light-dog
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      head-vox:
      - state: equipped-head-vox
      head-vulpkanin: # DeltaV - add modified vulp helmet
      - sprite: _DV/Clothing/Head/Hardsuits/paramedhelm.rsi
        state: equipped-head-vulpkanin
      head-feroxi: # DeltaV - add modified feroxi helmet
      - sprite: _DV/Clothing/Head/Hardsuits/paramedhelm.rsi
        state: equipped-head-feroxi
      head-dog:
      - state: equipped-head-dog
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.90
        Radiation: 0.75
  - type: PointLight
    radius: 5
    energy: 2
    color: "#00ffff"
  - type: Tag
    tags:
    - CorgiWearable
    - HelmetEVA
    - WhitelistChameleon
