- type: entity
  name: handheld crew monitor
  categories: [ DoNotMap ]
  parent: [ BaseHandheldComputer, BaseGrandTheftContraband ]
  # CMO-only bud, don't add more.
  id: HandheldCrewMonitor
  description: A hand-held crew monitor displaying the status of suit sensors.
  components:
  - type: Item
    heldPrefix: scanner
  - type: Sprite
    sprite: Objects/Specific/Medical/handheldcrewmonitor.rsi
    state: scanner
  - type: ActivatableUI
    key: enum.CrewMonitoringUIKey.Key
  - type: UserInterface
    interfaces:
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
  - type: CrewMonitoringConsole
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
  - type: WirelessNetworkConnection
    range: 500
  - type: StationLimitedNetwork
  - type: ReverseEngineering # Nyano
    difficulty: 2
    recipes:
      - HandheldCrewMonitor
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: HandheldCrewMonitor
  - type: ItemSlots # Delta V - Bigger Battery
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium

- type: entity
  name: handheld medical records tablet
  parent: BaseItem
  id: HandheldMedicalRecordsTablet
  description: A hand-held medical records monitor displaying patient information.
  components:
  - type: Item
    heldPrefix: scanner
    size: Small
  - type: Sprite
    sprite: Objects/Specific/Medical/handheldmedicalrecords.rsi
    state: medrecords
  - type: Icon
    sprite: Objects/Specific/Medical/handheldmedicalrecords.rsi
    state: medrecords
  - type: ActivatableUI
    key: enum.CharacterRecordConsoleKey.Key
  - type: UserInterface
    interfaces:
      enum.CharacterRecordConsoleKey.Key:
        type: CharacterRecordConsoleBoundUserInterface
  - type: CharacterRecordConsole
    consoleType: Medical

  - type: ReverseEngineering
    difficulty: 2
    recipes:
    - HandheldCrewMonitor
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - LowRiskItem
  - type: StealTarget
    stealGroup: HandheldCrewMonitor
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium

- type: entity
  id: SpyCrewMonitor
  name: spy monitor
  description: A spy device capable of connecting to crew monitoring servers.
  parent: HandheldCrewMonitor
  components:
  - type: Sprite
    sprite: Objects/Tools/spy_device.rsi
    state: icon
  - type: Item
    sprite: Objects/Tools/spy_device.rsi
  - type: PowerCellDraw
    useCharge: 10
  - type: StaticPrice
    price: 750
  - type: Tag # DeltaV - Let it be put in storage implants by removing HighRiskItem
    tags: []
  - type: CrewMonitoringConsole # DeltaV - disable crew crit / dead beeping alerts
    alertsEnabled: false

- type: entity
  id: SpyCrewMonitorEmpty
  parent: SpyCrewMonitor
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  id: SyndiCrewMonitor
  name: syndicate crew monitor
  description: The syndicated version of crew monitor, intercepts information from the server.
  parent: HandheldCrewMonitor
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/syndihandheldcrewmonitor.rsi
    state: syndiscanner
  - type: Item
    sprite: Objects/Specific/Medical/syndihandheldcrewmonitor.rsi
  - type: PowerCellDraw
    useCharge: 0 # DeltaV - Changed to zero with the removal of the microreactor in observations kit
  - type: CrewMonitoringConsole # DeltaV - disable crew crit / dead beeping alerts
    alertsEnabled: false

- type: entity
  id: SyndiCrewMonitorEmpty
  parent: SyndiCrewMonitor
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

