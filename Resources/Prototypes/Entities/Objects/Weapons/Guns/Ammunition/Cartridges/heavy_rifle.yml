- type: entity
  id: BaseCartridgeHeavyRifle
  name: cartridge (.10 rifle)
  parent: [ BaseCartridge, BaseSecurityContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
    - CartridgeHeavyRifle
  - type: CartridgeAmmo
    proto: BulletHeavyRifle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: StaticPrice
    price: 10

- type: entity
  id: CartridgeMinigun
  name: cartridge (.10 rifle)
  parent: BaseCartridgeHeavyRifle
  components:
  - type: CartridgeAmmo
    proto: BulletMinigun
    deleteOnSpawn: true

# High Velocity, (Seperate ymls seem not to work)
- type: entity
  id: BaseCartridgeHV
  name: cartridge (.10 high-velocity)
  parent: [ BaseCartridge, BaseSecurityContraband ]
  abstract: true
  components:
  - type: Tag
    tags:
    - CartridgeHV
  - type: CartridgeAmmo
    proto: BulletHV
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: CartridgeHV
  name: cartridge (.10 high-velocity)
  description: A harder to come by ammunition, made to fly quickly. Designed for fast firing weapons.
  parent: BaseCartridgeHV
  components:
  - type: CartridgeAmmo
    proto: BulletHV

- type: entity
  id: CartridgeHVAP
  name: cartridge (.10 high-velocity armor-piercing)
  parent: BaseCartridgeHV
  description: A very hard munition to come by, made to fly quickly. This is designed to cut through all sorts of steel and kevlar armor, but lacks in velocity and impact.
  components:
  - type: CartridgeAmmo
    proto: BulletHVAP
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#0a0a0a"

- type: entity
  id: CartridgeHVRubber
  name: cartridge (.10 high-velocity rubber)
  parent: BaseCartridgeHV
  description: A harder to come by ammunition, made to fly quickly. Designed for fast firing weapons. Designed to incapacitate rather than kill, these rubber tipped rounds bruise hard.
  components:
  - type: CartridgeAmmo
    proto: BulletHVRubber
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#1f4fa3"

- type: entity
  id: CartridgeHVPractice
  name: cartridge (.10 high-velocity practice)
  description: A harder to come by ammunition, made to fly quickly. Designed for fast firing weapons. Chalk ammunition is generally non-harmful, used for practice.
  parent: BaseCartridgeHV
  components:
  - type: CartridgeAmmo
    proto: BulletHVPractice
  -  type: Sprite
     layers:
     - state: base
       map: [ "enum.AmmoVisualLayers.Base" ]
     - state: tip
       map: [ "enum.AmmoVisualLayers.Tip" ]
       color: "#dbdbdb"

- type: entity
  id: CartridgeHVUranium
  name: cartridge (.10 high-velocity uranium)
  description: A harder to come by ammunition, made to fly quickly. Designed for fast firing weapons. A heavy tungstun core holding an exotic uranium-core, loses out on a lot of damage in favor of its radioactive potenial.
  parent: BaseCartridgeHV
  components:
  - type: CartridgeAmmo
    proto: BulletHVUranium
  -  type: Sprite
     layers:
     - state: base
       map: [ "enum.AmmoVisualLayers.Base" ]
     - state: tip
       map: [ "enum.AmmoVisualLayers.Tip" ]
       color: "#dbdbdb"

- type: entity
  id: CartridgeHVSpent
  name: cartridge (.10 high-velocity)
  suffix: spent
  parent: BaseCartridgeHV
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base-spent
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: SpentAmmoVisuals
  - type: CartridgeAmmo
    proto: BulletHV
    spent: true
  - type: Tag
    tags:
    - CartridgeHV
    - Trash
