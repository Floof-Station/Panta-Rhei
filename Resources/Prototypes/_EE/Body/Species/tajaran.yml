- type: markingsGroup
  parent: [Undergarments, EuphoriaCommonMarkingLayers]
  id: Tajaran
  onlyGroupWhitelisted: true
  limits: {} # Only common ones

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceTajaran
  name: Tajaran appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganTajaranTorso
      Head: OrganTajaranHead
      ArmLeft: OrganTajaranArmLeft
      ArmRight: OrganTajaranArmRight
      HandRight: OrganTajaranHandRight
      HandLeft: OrganTajaranHandLeft
      LegLeft: OrganTajaranLegLeft
      LegRight: OrganTajaranLegRight
      FootLeft: OrganTajaranFootLeft
      FootRight: OrganTajaranFootRight
      Brain: OrganTajaranBrain
      Eyes: OrganTajaranEyes
      Tongue: OrganTajaranTongue
      Appendix: OrganTajaranAppendix
      Ears: OrganTajaranEars
      Lungs: OrganTajaranLungs
      Heart: OrganTajaranHeart
      Stomach: OrganTajaranStomach
      Liver: OrganTajaranLiver
      Kidneys: OrganTajaranKidneys
  - type: HumanoidProfile
    species: Tajaran

- type: entity
  parent:
  - AppearanceTajaran
  - BaseSpeciesMobOrganic
  id: MobTajaran
  name: Urist McMraow
  components:
  - type: Hunger
    baseDecayRate: 0.02083333332 # Euphoria - 25% more than base
  - type: Thirst
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35 # Floof
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Tajaran
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.85  # 0.7 is base speed.
      80: 0.75  # 0.5 is base speed.
  - type: NightVision
    color: "#808080"
    activateSound: null
    deactivateSound: null
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: Speech
    speechSounds: Alto
    speechVerb: Felinid # Euphoria
    allowedEmotes: ['Meow', 'Hiss', 'Mew', 'Purr', 'Growl'] # Euphoria | Emote wheel
  - type: DamageOnHighSpeedImpact # Landing on all fours!
    damage:
      types:
        Blunt: 1
  - type: Stamina
    baseCritThreshold: 85
    decay: 2.55 # 3 base decay multiplied by 0.85 = 2.55
  - type: TypingIndicator
    proto: felinid
  - type: PseudoItem
    storedOffset: 0,17
    shape:
    - 0,0,1,4
    - 0,2,3,4
    - 4,0,5,4
  - type: Vocal
    wilhelm: "/Audio/Nyanotrasen/Voice/Felinid/cat_wilhelm.ogg"
    sounds:
      Male: MaleTajaran
      Female: FemaleTajaran
      Unsexed: MaleTajaran
  - type: LanguageKnowledge #Euphoria - Languages
    speaks:
    - TauCetiBasic
    - SiikMaas
    - SiikTajr
    - Cat
    understands:
    - TauCetiBasic
    - SiikMaas
    - SiikTajr
    - Cat
    naturalLanguage: SiikMaas
  - type: Felinid # real
  - type: NoShoesSilentFootsteps
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - TajaranEmotes # Added
  - type: Temperature
    currentTemperature: 311.76  # Body temperature of cat
  - type: TemperatureDamage
    coldDamageThreshold: 248.15 # -25 degrees centigrade, like 12 degrees below normal
    heatDamage:
      types:
        Heat: 2 # poor kitty
    coldDamage:
      types:
        Cold: 0.65 # in line with cold resist
  - type: ThermalRegulator
    normalBodyTemperature: 311.76



