- type: entity
  parent: MeteorSwarmScheduler
  id: MeteorSwarmCalmScheduler
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1200 # 20 min
    minMaxEventTiming:
      min: 1500 # 25 min
      max: 4500 # 75 min
    scheduledGameRules: !type:GroupSelector
      children:
      - id: MeteorSwarm
        weight: 1
      - id: NothingHappens # 1/3 of the meteor swarms do nothing on extended/greenshift
        weight: 0.5
