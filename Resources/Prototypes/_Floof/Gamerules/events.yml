
- type: entity
  parent: BaseGameRule
  id: AntagFoodCriticSpawn
  components:
  - type: StationEvent
    weight: 8
    duration: null
    earliestStart: 30
    reoccurrenceDelay: 60 # I don't think this makes sense to be here but eh
    minimumPlayers: 10
    maxOccurrences: 1 #This event can only occur once in a given round
  - type: PrecognitionResult
    message: psionic-power-precognition-food-critic-result-message
  - type: AntagRandomSpawn
  - type: AntagLoadPlayerCharacterRule
  - type: AntagObjectives
    objectives:
    - FoodCriticSurviveObjective
  - type: AntagSelection
    agentName: food-critic-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostAntagFoodCritic
      min: 1
      max: 1
      pickPlayer: false
      startingGear: FoodCriticGear
      #roleLoadout:
      #- RoleSurvivalSpaceNinja
      briefing:
        text: food-critic-role-greeting
        color: Lime
        sound: /Audio/Items/beep.ogg
      mindRoles:
      - MindRoleFoodCritic
  - type: DynamicRuleCost
    cost: 5

# Does literally nothing. You'd never guess.
- type: entity
  parent: BaseGameRule
  id: NothingHappens
  components:
  - type: StationEvent
    weight: 0
    duration: 0
    earliestStart: 0 # You won't believe it, this is required because delta-v edits to the StationEventManager are shitcode that rely on the AllEvents() method
    reoccurrenceDelay: 0
  - type: NothingHappensRule # And this shit is needed because if there's an active gamerule of prototype T, AllEvents() won't return T's