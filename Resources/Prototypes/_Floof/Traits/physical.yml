- type: trait
  id: CyberEyesOmni
  category: Medical
  name: trait-name-CyberEyesOmni
  description: trait-description-CyberEyesOmni
  cost: 4
  conflicts:
  - CyberEyesMedical
  - CyberEyesSecurity
  #- CyberEyesDiagnostic
  conditions:
  - !type:InDepartmentCondition
    department: Command
  - !type:HasJobCondition
    invert: true
    job: Prisoner
  - !type:HasJobCondition # God forbid DV have all the heads also be in commeand
    job: HeadOfSecurity
  - !type:HasJobCondition
    job: ChiefMedicalOfficer
  - !type:HasJobCondition
    job: Quartermaster
  - !type:HasJobCondition
    job: ChiefEngineer
  - !type:HasJobCondition
    job: ResearchDirector
  - !type:HasJobCondition
    job: ChiefJustice
  effects:
  - !type:AddCompsEffect
    components:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: SolutionScanner
    - type: ShowHealthIcons
      damageContainers:
      - Biological
      - BiologicalMetaphysical
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - BiologicalMetaphysical
      - Inorganic
      - Silicon
      - HumanoidSilicon
