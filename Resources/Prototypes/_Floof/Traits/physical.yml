- type: trait
  id: LeftBionicPryArm
  name: trait-name-LeftBionicPryArm
  description: trait-description-BionicPryArm
  category: Disabilities
  cost: 2
  conflicts:
  - ArmAmputeeRight
  - ArmAmputeeLeft
  - RightBionicPryArm
  effects:
  - !type:AddCompsEffect
    components:
    - type: Amputee
      removeBodyPart: Arm
      partSymmetry: Left
      protoId: JawsOfLifeLeftArm
      slotId: "left arm"

- type: trait
  id: RightBionicPryArm
  name: trait-name-RightBionicPryArm
  description: trait-description-BionicPryArm
  category: Disabilities
  cost: 2
  conflicts:
  - ArmAmputeeRight
  - ArmAmputeeLeft
  - LeftBionicPryArm
  effects:
  - !type:AddCompsEffect
    components:
    - type: Amputee
      removeBodyPart: Arm
      partSymmetry: Right
      protoId: JawsOfLifeRightArm
      slotId: "right arm"

- type: trait # Gives the effect of printable cybernetic eyes except no one has coded organ replacements yet
  id: CyberEyes
  name: trait-name-CyberEyes
  description: trait-description-CyberEyes
  category: Medical
  cost: 6 # Cost balanced
  conflicts:
  - Blindness
  - PoorVision
  effects:
  - !type:AddCompsEffect # To do - When someone codes organ replacement
    components:
    - type: FlashImmunity
      showInExamine: false
    - type: EyeProtection

- type: trait
  id: CyberEyesNightVision
  category: Medical
  name: trait-name-CyberEyesNightVision
  description: trait-description-CyberEyesNightVision
  cost: 7
  conflicts:
  - Blindness
  - PoorVision
  conditions:
  - !type:HasJobCondition
    invert: true
    job: Prisoner
  - !type:OneOfSpeciesCondition
    invert: true
    species:
    - Felinid
    - Shadowkin
    - Rodentia
    - Tajaran
  effects:
  - !type:AddCompsEffect
    components:
    - type: NightVision

- type: trait
  id: CyberEyesThermoVision
  category: Medical
  name: trait-name-CyberEyesThermoVision
  description: trait-description-CyberEyesThermoVision
  cost: 7
  conflicts:
  - Blindness
  - PoorVision
  conditions:
  - !type:HasJobCondition
    invert: true
    job: Prisoner
  effects:
  - !type:AddCompsEffect
    components:
    - type: ThermalVision
      pulseTime: 2
      toggleAction: PulseThermalVision

- type: trait
  id: CyberEyesSecurity
  category: Medical
