- type: trait
  id: CyberEyesMedical
  category: Medical
  name: trait-name-CyberEyesMedical
  description: trait-description-CyberEyesMedical
  cost: 3
  conflicts:
  - CyberEyesOmni
  effects:
  - !type:AddCompsEffect
    components:
    - type: SolutionScanner
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - BiologicalMetaphysical
