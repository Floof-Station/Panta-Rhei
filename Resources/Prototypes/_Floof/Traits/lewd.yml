- type: trait
  id: CumProducer
  category: Medical
  cost: 0
  conditions:
    - !type:HasCompCondition
      component: BorgChassis
      invert: true
  effects:
  - !type:AddCompsEffect
    components:
    - type: CumProducer
      solutionname: "penis"
    - type: SolutionContainerManager
      solutions:
        penis:
          maxVol: 25
          reagents:
          - ReagentId: Cum
            Quantity: 25

