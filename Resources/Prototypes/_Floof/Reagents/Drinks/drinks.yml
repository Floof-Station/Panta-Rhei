# For reagents that are sticky and vicous
- type: reagent
  id: BaseViscous
  abstract: true
  viscosity: 0.15
  recognizable: false
  footstepSound:
    collection: FootstepSticky
    params:
      volume: 3

- type: reagent
  id: NikkosNaughtyNectar
  name: reagent-name-NNN
  parent: [BaseViscous, BaseDrink]
  desc: reagent-desc-NNN
  physicalDesc: reagent-physical-desc-creamy
  flavor: nikkonectar
  color: "#deebff"
  viscosity: 0.15
  metabolisms:
    Bloodstream:
      metabolismRate: 0.1
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Medium
        messages:
          - "reagent-effect-aphrodisiac-mild1"
          - "reagent-effect-aphrodisiac-mild2"
          - "reagent-effect-aphrodisiac-mild3"
          - "reagent-effect-aphrodisiac-mild4"
          - "reagent-effect-aphrodisiac-mild5"
        probability: 0.02
        conditions:
          - !type:ReagentCondition
            reagent: NikkosNaughtyNectar
            max: 50
          - !type:ConsentCondition
            consent: Aphrodisiacs

- type: reagent
  id: BoykissersEnergy
  name: reagent-name-boykisser-energy
  parent: [BaseViscous, BaseDrink]
  desc: reagent-desc-boykisser-energy
  physicalDesc: reagent-physical-desc-bubbly
  flavor: nutty
  color: "#FD3DB5"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.15
        sprintSpeedModifier: 1.15
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter
      - !type:GenericStatusEffect
        key: Drowsiness
        time: 10
        type: Remove
      - !type:ResetNarcolepsy
        conditions:
        - !type:ReagentCondition
          reagent: BoykissersEnergy
          min: 20

- type: reagent
  id: VBBeer
  name: reagent-name-VB-beer
  parent: BaseAlcohol
  desc: reagent-desc-VB-beer
  physicalDesc: reagent-physical-desc-bubbly
  flavor: vbbeer
  color: "#e3e77b"
  recognizable: true
  fizziness: 0.6

- type: reagent # You may ask me why, but I got sick of seeing green come of cream pies.
  id: BananaCreamPie
  parent: [BaseViscous, Nutriment]
  name: reagent-name-bananacreampie
  desc: reagent-desc-bananacreampie
  physicalDesc: reagent-physical-desc-creamy
  flavor: bananacreampie
  color: "#fffdd0"
  recognizable: true
  metabolisms:
    Digestion:
      metabolites:
        Nutriment: 0.8
        Vitamin: 0.2

- type: reagent
  id: PeanutButterWhiskey
  name: reagent-name-peanut-butter-whiskey
  parent: BaseJuice
  desc: reagent-desc-peanut-butter-whiskey
  physicalDesc: reagent-physical-desc-sticky
  flavor: sweet
  color: "#DCA465"
  recognizable: true
