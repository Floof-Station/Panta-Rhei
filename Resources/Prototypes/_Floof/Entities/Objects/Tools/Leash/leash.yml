- type: entity
  id: BaseLeash
  parent: BaseItem
  name: leash
  description: Helps keep your animals or friends close to you. Attach to supported objects or clothing (such as collars) to use. You can pull attached entities while holding the leash.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Floof/Objects/Tools/leash.rsi
    layers:
    - state: icon
    scale: 0.7, 0.7
  - type: Item
    sprite: _Floof/Objects/Tools/leash.rsi
  - type: Leash
    pullInterval: 0.75
  - type: EntityConfiguration
    configGroups:
      length:
        name: leash-config-category-length
        options:
        - name: leash-config-length
          value: 3
        - name: leash-config-length
          value: 2.5
        - name: leash-config-length
          value: 2
        - name: leash-config-length
          value: 1.5
        - name: leash-config-length
          value: 1
      preset:
        name: leash-config-category-preset
        tooltip: leash-config-preset-tooltip
        options:
        - name: leash-config-preset
          value: Leash10
        - name: leash-config-preset
          value: Leash5
        - name: leash-config-preset
          value: Leash0
  - type: Anchorable
    delay: 3
    snap: false # One day this will work. Not today though.

- type: entity
  id: LeashBasic
  parent: BaseLeash
  components:
  - type: Leash
    length: 3
    attachDelay: 4
    detachDelay: 4
    selfDetachDelay: 10

- type: entity
  id: LeashAdvanced
  parent: LeashBasic
  name: advanced leash
  components:
  - type: Leash
    maxJoints: 2
    attachDelay: 2.5
    detachDelay: 2
    selfDetachDelay: 15

- type: entity
  id: LeashBluespace
  parent: BaseLeash
  name: bluespace leash
  description: Powered by a miniature singularity inside the handle. Not safe for use by crewmembers.
  suffix: DEBUG, DO NOT MAP
  components:
  - type: Leash
    maxJoints: 10
    attachDelay: 2.5
    detachDelay: 5
    selfDetachDelay: 20
    pullInterval: 0.1
  - type: EntityConfiguration
    configGroups:
      length:
        name: leash-config-category-length
        options:
        - name: leash-config-length
          value: 15
        - name: leash-config-length
          value: 10
        - name: leash-config-length
          value: 7.5
        - name: leash-config-length
          value: 5
        - name: leash-config-length
          value: 3
        - name: leash-config-length
          value: 2
        - name: leash-config-length
          value: 1
      preset:
        name: leash-config-category-preset
        options:
        - name: leash-config-preset
          value: Leash20
        - name: leash-config-preset
          value: Leash10
        - name: leash-config-preset
          value: Leash5
        - name: leash-config-preset
          value: Leash0
