- type: entity
  id: BaseLeash
  parent: BaseItem
  name: leash
  description: Helps keep your animals or friends close to you. Attach to supported objects or clothing (such as collars) to use. You can pull attached entities while holding the leash.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Floof/Objects/Tools/leash.rsi
    layers:
    - state: icon
    scale: 0.7, 0.7
  - type: Leash
    pullInterval: 0.75
    currentConfig:
      ropeConfig: Leash10
      length: 3
    availableConfigs:
    # N links
    - ropeConfig: Leash10
      length: 3
    - ropeConfig: Leash10
      length: 2
    - ropeConfig: Leash5
      length: 1.5
    - ropeConfig: Leash5
      length: 1
    # 0 links
    - ropeConfig: Leash0
      length: 3
    - ropeConfig: Leash0
      length: 2
    - ropeConfig: Leash0
      length: 1.5
    - ropeConfig: Leash0
      length: 1
  - type: Anchorable
    delay: 3
    snap: false # One day this will work. Not today though.

- type: entity
  id: LeashBasic
  parent: BaseLeash
  components:
  - type: Leash
    length: 3
    maxDistance: 6
    attachDelay: 4
    detachDelay: 4
    selfDetachDelay: 10

- type: entity
  id: LeashAdvanced
  parent: LeashBasic
  name: advanced leash
  components:
  - type: Leash
    maxJoints: 2
    attachDelay: 2.5
    detachDelay: 2
    selfDetachDelay: 15

- type: entity
  id: LeashBluespace
  parent: BaseLeash
  name: bluespace leash
  description: Powered by a miniature singularity inside the handle. Not safe for use by crewmembers.
  suffix: DEBUG, DO NOT MAP
  components:
  - type: Leash
    maxDistance: 20
    maxJoints: 10
    attachDelay: 2.5
    detachDelay: 5
    selfDetachDelay: 20
    pullInterval: 0.1
