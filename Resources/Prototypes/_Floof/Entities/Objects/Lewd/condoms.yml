- type: entity
  parent: BaseItem
  id: CondomPackTeal
  name: Teal Condom Pack
  description: A one size fits all single use condom packet.
  components:
  - type: Sprite
    sprite: _Floof/Clothing/Under/Underwear/condoms.rsi
    state: condom_pack_teal
  - type: StaticPrice
    price: 10
  - type: SpawnItemsOnUse
    items:
    - id: TealUnusedCondom
    sound:
      path: /Audio/Effects/packetrip.ogg
  - type: Tag
    tags:
    - CondomWrapper

- type: entity
  parent: CondomPackTeal
  id: CondomPackPink
  name: Pink Condom Pack
  components:
  - type: Sprite
    sprite: _Floof/Clothing/Under/Underwear/condoms.rsi
    state: condom_pack_pink
  - type: SpawnItemsOnUse
    items:
    - id: PinkUnusedCondom

