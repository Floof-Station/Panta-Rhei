### euphoria-marked paint prototypes have been placed here for ease of access, instead of putting them in their own directory in the _Euphoria directory

#Blue
- type: entity
  parent: PaintBase
  name: blue paint # euphoria - added name
  id: SprayPaintBlue
  suffix: Blue
  components:
  - type: Sprite
    sprite: _Floof/Objects/Fun/spraycans.rsi
    layers:
    - state: spray
      map: ["Base"]
    - state: spray_cap_colors
      map: ["enum.OpenableVisuals.Layer"]
      color: "#5890f7"
  - type: ColorPaint
    color: "#5890f7"
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "spray_colors" , color: "#5890f7"}
          False: {state: "spray_cap_colors" , color: "#5890f7"}

