- type: entity
  name: spray paint spawner
  suffix: 1, 60%
  id: SprayPaintSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Floof/Objects/Fun/spraycans.rsi
      state: death2
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: SprayPaintTable
      prob: 0.6

- type: entityTable
  id: SprayPaintTable
  table: !type:GroupSelector
    children:
    # Common Group
    - !type:GroupSelector
      weight: 70
      children:
      - !type:EntSelector
        id: SprayPaintRed
      - !type:EntSelector
        id: SprayPaintBlue
      - !type:EntSelector
        id: SprayPaintGreen
      - !type:EntSelector
        id: SprayPaintBlack
      - !type:EntSelector
        id: SprayPaintOrange
      - !type:EntSelector
        id: SprayPaintPurple
      - !type:EntSelector
        id: SprayPaintWhite
      - !type:EntSelector
        id: SprayPaintDeepRed
      - !type:EntSelector
        id: SprayPaintDeepBlue
      - !type:EntSelector
        id: SprayPaintDeepGreen
      - !type:EntSelector
        id: SprayPaintDeepBlack
      - !type:EntSelector
        id: SprayPaintDeepPurple
      - !type:EntSelector
        id: SprayPaintGrey
      - !type:EntSelector
        id: SprayPaintDeepGrey
      - !type:EntSelector
        id: SprayPaintYellow
      - !type:EntSelector
        id: SprayPaintPink
      - !type:EntSelector
        id: SprayPaintBrown
    # Uncommon Group
    - !type:GroupSelector
      weight: 25
      children:
      - !type:EntSelector
        id: DeathPaint
      - !type:EntSelector
        id: DeathPaintTwo
      - !type:EntSelector
        id: FunnyPaint
      - !type:EntSelector
        id: FunnyPaintYellow
    # Rare Group
    - !type:GroupSelector
      weight: 5
      children:
      - !type:EntSelector
        id: SprayPaintSilver
      - !type:EntSelector
        id: SprayPaintGold
