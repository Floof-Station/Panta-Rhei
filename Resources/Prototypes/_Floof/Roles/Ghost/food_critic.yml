#Objectives
- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseFoodCriticObjective
  components:
  - type: Objective
    # difficulty isn't used since all objectives are picked
    difficulty: 1.5
    issuer: objective-issuer-donk-co
  - type: RoleRequirement
    roles:
    - FoodCriticRole

- type: entity
  parent: [BaseFoodCriticObjective, BaseSurviveObjective]
  id: FoodCriticSurviveObjective
  name: Live to write your review
  description: The food can't be that bad...
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/burger.rsi
      state: icon

# Mind Role
- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleFoodCritic
  name: Food Critic Role
  components:
  - type: MindRole
    antagPrototype: FoodCriticAntagPrototype
    subtype: role-subtype-food-critic
    #exclusiveAntag: true #Uncommenting this breaks everything as of July 2nd 2026
  - type: FoodCriticRole

# Antag Prototype
- type: antag
  id: FoodCriticAntagPrototype
  name: roles-antag-food-critic-name
  antagonist: true
  setPreference: false
  objective: roles-antag-food-critic-objective
  #requirements:
  #- !type:OverallPlaytimeRequirement # DeltaV - Playtime requirement
    #time: 10h
  #guides: [ SpaceNinja ]



# Starting Gear
- type: startingGear
  id: FoodCriticGear
  equipment:
    id: VisitorPDA
    ears: ClothingHeadsetService
    #pocket1: EncryptionKeyTraffic # They do not need this IF they are not spawning on a ship.
    jumpsuit: ClothingUniformSeniorBartender
    shoes: ClothingShoesBootsLaceup
    back: ClothingBackpack

# Spawner
- type: entity
  categories: [ Spawner ]
  parent: MarkerBase
  id: SpawnPointFoodCritic
  name: ghost role spawn point
  suffix: food critic
  components:
  - type: GhostRole
    name: ghost-role-information-food-critic-name
    description: ghost-role-information-food-critic-description
    mindRoles:
    - MindRoleFoodCritic
    raffle:
      settings: default
  - type: GhostRoleCharacterSpawner
    outfitPrototype: FoodCriticGear
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: Objects/Consumable/Food/burger.rsi

#New Antag Spawn Point
- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: SpawnPointGhostAntagFoodCritic
  components:
  - type: GhostRole
    name: ghost-role-information-food-critic-name
    description: ghost-role-information-food-critic-description
    rules: ghost-role-information-peaceful-antagonist-rules
    mindRoles:
    - MindRoleFoodCritic
    raffle:
      settings: default
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
    state: human

- type: entity
  parent: BaseGameRule
  id: AntagFoodCriticSpawn
  components:
  - type: StationEvent
    weight: 5 # DeltaV - was 6
    duration: null
    earliestStart: 30
    reoccurrenceDelay: 60 # DeltaV - was 20
    minimumPlayers: 40 # DeltaV - was 30
  - type: PrecognitionResult # DeltaV - Precogniton
    message: psionic-power-precognition-food-critic-result-message
  - type: AntagRandomSpawn
  - type: GhostRoleCharacterSpawner
    outfitPrototype: FoodCriticGear
  - type: AntagObjectives
    objectives:
    - FoodCriticSurviveObjective
  - type: AntagRandomObjectives # DeltaV: Random objectives for hacking and killing
    sets:
    - groups: NinjaHackingObjectiveGroups
      maxPicks: 2 # only pick 2 of 3 of them to reduce metagaming
    - groups: NinjaBonusObjectiveGroups
      maxPicks: 2 # 2 kill or steal objectives max
    maxDifficulty: 100 # ignore difficulty, use maxPicks instead
  - type: AntagSelection
    agentName: food-critic-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostAntagFoodCritic
      min: 1
      max: 1
      pickPlayer: false
      #startingGear: FoodCriticGear
      #roleLoadout:
      #- RoleSurvivalSpaceNinja
      briefing:
        text: food-critic-role-greeting
        color: Lime
        sound: /Audio/Items/beep.ogg
      #components:
      mindRoles:
      - MindRoleFoodCritic
  - type: DynamicRuleCost
    cost: 20
