# Automatically links to a shock collar
- type: loadout
  id: RemoteSignallerCollarLink
  storage:
    back:
    - RemoteSignallerCollarLink
  spawnEffects:
  - !type:LoadoutLinkToEntitiesEffect
    whitelist:
      components:
      - ShockOnTrigger
    linkThisToOther: true # Links this signaller to activate the collar
  groupBy: remoteSignaller

