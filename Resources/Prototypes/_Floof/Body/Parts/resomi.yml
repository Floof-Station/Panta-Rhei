- type: entity
  id: PartResomi
  parent: [BaseItem, BasePart]
  name: "resomi body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: OrganicPart
  - type: BodyPart
    species: Resomi

- type: entity
  id: TorsoResomi
  name: "resomi torso"
  parent: [PartResomi, BaseTorso]
  components:
  - type: Sprite
    netsync: false
    sprite: _Floof/Mobs/Species/Resomi/parts.rsi
    state: "torso_m"
  - type: Icon
    sprite: _Floof/Mobs/Species/Resomi/parts.rsi
    state: "torso_m"

