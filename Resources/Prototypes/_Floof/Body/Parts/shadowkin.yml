- type: entity
  id: PartShadowkin
  parent: [BaseItem, BasePart]
  name: "Shadowkin body part"
  abstract: true
  components:
    - type: Sprite
      netsync: false
      sprite: _Floof/Mobs/Species/Shadowkin/parts.rsi
    - type: Icon
      sprite: _Floof/Mobs/Species/Shadowkin/parts.rsi
    - type: Damageable
      damageContainer: OrganicPart # Shitmed
    - type: BodyPart
      species: Shadowkin

- type: entity
  id: TorsoShadowkin
  name: "Shadowkin torso"
  parent: [PartShadowkin, BaseTorso]
  components:
    - type: Sprite
      state: "torso_m"
    - type: Icon
      state: "torso_m"

- type: entity
  id: HeadShadowkin
