- type: markingsGroup
  parent: [Undergarments, EuphoriaCommonMarkingLayers]
  id: Resomi
  onlyGroupWhitelisted: true
  limits: {} # Only common ones

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceResomi
  name: resomi appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganResomiTorso
      Head: OrganResomiHead
      ArmLeft: OrganResomiArmLeft
      ArmRight: OrganResomiArmRight
      HandRight: OrganResomiHandRight
      HandLeft: OrganResomiHandLeft
      LegLeft: OrganResomiLegLeft
      LegRight: OrganResomiLegRight
      FootLeft: OrganResomiFootLeft
      FootRight: OrganResomiFootRight
      Brain: OrganResomiBrain
      Eyes: OrganResomiEyes
      Tongue: OrganResomiTongue
      Appendix: OrganResomiAppendix
      Ears: OrganResomiEars
      Lungs: OrganResomiLungs
      Heart: OrganResomiHeart
      Stomach: OrganResomiStomach
      Liver: OrganResomiLiver
      Kidneys: OrganResomiKidneys
  - type: HumanoidProfile
    species: Resomi
  - type: Inventory
    speciesId: resomi
    displacements: &allDisplacements
      jumpsuit: &standardDisplacement
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: hands
      head:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: head
      back:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: ears
      shoes: &feetDisplacement
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: feet
      neck:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: neck
      mask:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: mask
      suitstorage:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: suitStorage
      belt:
        sizeMaps:
          32:
            sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
            state: belt
      # We just alias outer clothing and undergarments to the jumpsuit/feet displacements. This isnt perfect, but it works for most clothing.
      outerClothing: *standardDisplacement
      undergarmentTop: *standardDisplacement
      undergarmentBottom: *standardDisplacement
      undergarmentSocks: *feetDisplacement
    femaleDisplacements: *allDisplacements # afaik female resomi use the same displacements as male ones.

- type: entity
  parent:
  - AppearanceResomi
  - BaseSpeciesMobOrganic
  id: MobResomi
  name: Urist McRaptor
  components:
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - Schechi
    understands:
    - TauCetiBasic
    - Schechi
    naturalLanguage: Schechi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Speech
    speechVerb: Parrot
    speechSounds: UnisexResomi
    allowedEmotes: [ 'Chirp', 'Purr', 'Growl', 'HarpySquawk', 'HarpyCaw', 'Coo' ]
  - type: Vocal # Floofstation - uncommented
    sounds:
      Male: MaleResomi
      Unsexed: MaleResomi
      Female: FemaleResomi
  - type: Hands # Note: not placing this in the appearence prototype because it doesn't inherit any hands
    handDisplacement:
      sizeMaps:
        32:
          sprite: _Floof/Mobs/Species/Resomi/displacement.rsi
          state: inHand
  - type: FootPrints # Goobstation - resomi footprints
    leftBarePrint: "footprint-left-bare-lizard"
    rightBarePrint: "footprint-right-bare-lizard"
  - type: Bloodstream # Goobstation - lore stuff
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 200
  - type: MeleeWeapon # Goobstation - aliem raptors probably use their claws
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Damageable # Goobstation - resomi damage modifiers
    damageModifierSet: Resomi
  - type: TemperatureDamage
    coldDamageThreshold: 195.4 # Goobstation - freezing point of ammonia is -77.75°C
    heatDamageThreshold: 320.15 # Goobstation - space chickens can't tolerate reasonable temperatures, but requiring them to stay icy would be cringe, so instead make their heat damage threshold dangerously close to standard atmos, at 47°C
    coldDamage:
      types:
        Cold: 0.05 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat: 3 #per second, scales with temperature & other constants
  - type: MovementSpeedModifier
    weightlessAcceleration: 2.5 # Goobstation - Birb move fast in zero-g
  - type: PseudoItem # Goobstation - Baggable; certified smol ops
    storedOffset: -10,0
    shape:
    - 0, 0, 3, 2
    - 0, 2, 5, 4
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - ResomiEmotes # Added


