  - type: VisualOrgan
    data:
      sprite: _Floof/Mobs/Species/Arachne/parts.rsi # Ditto

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganArachneExternal ]
  id: OrganArachneTorso

- type: entity
