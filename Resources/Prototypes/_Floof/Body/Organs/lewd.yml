- type: entity
  parent: BaseHumanOrgan
  id: BaseLewdOrgan
  description: Ew.
  abstract: true
  components:
  - type: Organ
    removable: false # There is currently no surgeries defined for this organ. Even if you could detach it, you wouldn't be able to reattach it to someone without the relevant organ slot.
  - type: LewdOrgan

# This is silly.
# None of these have sprites now and also can't be removed/added via surgeries. If you want to make them transplantable, you'll have to make sprites for them.
- type: entity
  parent: BaseLewdOrgan
  id: OrganGenericMammaryGlands
  name: mammary glands
  description: A mammalian organ that produces milk for feeding newborns.
  components:
  - type: LewdOrgan
    data:
      organKind: Breasts
      solutionName: mammaryGlands
      solutionVolume: 30
      producedReagents:
      - ReagentId: Milk
        Quantity: 0.1 # Per second, takes ~5 minutes to fill up
      drainSpeed: 0

- type: entity
  parent: BaseLewdOrgan
  id: OrganGenericPenis # Eek!
  name: penis
  description: An appendage used by the majority of animal species to fertilize egg cells. Testicular glands included.
  components:
  - type: LewdOrgan
    data:
      organKind: Penis
      solutionName: testicles
      solutionVolume: 15
      producedReagents:
      - ReagentId: Cum
        Quantity: 0.05 # Per second, takes ~10 minutes to fill up
      drainSpeed: 0

# So fun fact, the female reproductive system consists from 3-5 different organs, but there isn't a generic name to describe the whole system, so I had to pick one
# This one is tricky. Irl this organ doesn't produce much lubricant, so it's difficult to make it noticable while also retaining some immersion. So the default is low.
# Players who want to "flood the room with their juices" can pick up a trait to do so. The primary purpose of this organ is deposition though.
- type: entity
  parent: BaseLewdOrgan
  id: OrganGenericVagina
  name: vagina
  description: An organ housing the female reproductive system.
  components:
  - type: LewdOrgan
    data:
      organKind: Vagina
      solutionName: uterus # I'm not actually sure what to call this
      solutionVolume: 10
      producedReagents:
      - ReagentId: NaturalLubricant
        Quantity: 0.03 # Per second, takes ~10 minutes to fill up
      drainSpeed: 0.05 # Same as the base speed of the penis.
      spillDrain: true

# No, we're not getting into bathroom stuff. This is here only for deposition.
- type: entity
  parent: BaseLewdOrgan
  id: OrganGenericRectum
  name: rectum
  description: Why are you holding this?
  components:
  - type: LewdOrgan
    data:
      organKind: Rectum
      solutionName: rectum
      solutionVolume: 30
      drainSpeed: 0.05 # Same as the base speed of the penis.
      spillDrain: true
