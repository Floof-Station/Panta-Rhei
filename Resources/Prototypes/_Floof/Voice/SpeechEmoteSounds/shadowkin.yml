# Euph
- type: emoteSounds
  id: ShadowkinBase
  abstract: true
  params:
    variation: 0.125
  sounds:
    Snore:
      collection: Snores
    Honk:
      collection: BikeHorn
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
    Hiss:
      collection: FelinidHisses
    Meow:
      collection: FelinidMeows
    Mew:
      collection: FelinidMews
    Growl:
      collection: FelinidGrowls
    Purr:
      collection: FelinidPurrs
    Mars:
      collection: Mars
    Wurble:
      collection: Wurble

- type: emoteSounds
  id: MaleShadowkin
  parent: ShadowkinBase # Euph
  params:
    variation: 0.125
  sounds:
    Scream:
      collection: ShadowkinMaleScreams
    Laugh:
      collection: MaleLaugh
    Sneeze:
      collection: MaleSneezes
    Cough:
      collection: MaleCoughs
    Yawn:
      collection: MaleYawn
    Snore:
      collection: Snores
    Sigh:
      collection: MaleSigh
    Crying:
      collection: MaleCry
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
    Gasp:
      collection: MaleGasp
    DefaultDeathgasp:
      collection: MaleDeathGasp
    Marr:
      path: /Audio/_Starlight/Voice/Shadekin/mar.ogg
    Wurble:
      path: /Audio/_Starlight/Voice/Shadekin/wurble.ogg
    Hiss:
      collection: FelinidHisses
    Purr:
      collection: FelinidPurrs
    Growl:
      collection: FelinidGrowls
    Gulp: # Goob
      path: /Audio/_Goobstation/Voice/Human/gulp.ogg

