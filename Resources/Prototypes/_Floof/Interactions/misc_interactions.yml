- type: Interaction
  id: Bite
  parent: [BaseGlobal, BaseMouth]
  priority: -15 # Non-erp but generally not something you'd want to do to strangers
  delay: 0.4
  cooldown: 5
  globalCooldown: true
  range: {max: 0.666} # Very close-range
  hideByRequirement: true
  requirement:
    !type:ComplexRequirement
    requirements:
    - !type:EntityWhitelistRequirement
      whitelist:
        components: [MobState, Edible] # Don't go around biting inanimate objects.
    - !type:SlotObstructionRequirement
      slot: MASK
  action:
    !type:ComplexAction
    requireAll: false
    actions:
    - !type:ModifyHealthAction
      randomFactor: {min: 0.5, max: 1.5}
      damage:
        types: {Piercing: 5}
    - !type:NoOpAction # Just so it shows a success popup even if you cant bite
  effectSuccess:
    popup: Obvious
    sound:
      path: /Audio/Effects/bite.ogg
      params:
        volume: -3
        maxDistance: 4
  effectFailure:
    popup: Subtle
