- type: Interaction
  id: LookAt
  parent: BaseGlobal
  priority: 4
  requiresHands: false
  requiresCanAccess: false
  requiresCanInteract: false # Floof
  contactInteraction: false
  allowSelfInteract: true
  icon: /Textures/Interface/Actions/eyeopen.png
  range: {max: 20}
  effectSuccess:
    popup: Obvious
    sound: {path: /Audio/Effects/ominous.ogg}
    soundPerceivedByOthers: false # Can be used to attract attention, but not to spam sounds or chat
  action:
    !type:NoOpAction

- type: Interaction
  id: WaveAt
  parent: [BaseHands, BaseGlobal]
  priority: 3
  requiresCanAccess: false
  contactInteraction: false
  range: {max: 20}
  effectSuccess:
    popup: Obvious
    sound: {path: /Audio/Effects/ominous.ogg}
    soundPerceivedByOthers: false
  hideByRequirement: true
  requirement:
    !type:MobStateRequirement # Don't wave your hands at inanimate objects smh
    inverted: true
  action:
    !type:NoOpAction

# Knocking on the target - windows, doors, etc.
- type: Interaction
  id: KnockOn
  parent: BaseHands
  priority: 20
  effectSuccess:
    popup: Visible
    sound: {path: /Audio/Effects/glass_knock.ogg}
  action:
    !type:NoOpAction

# Rattling a fence
- type: Interaction
  id: Rattle
  parent: BaseHands
  priority: 20
  effectSuccess:
    popup: Visible
    sound: {collection: FenceRattle}
  action:
    !type:NoOpAction

# Show your interest!
- type: Interaction
  id: CheckOut
  parent: BaseGlobal
  priority: -100 # Very specific ERP meaning, should be at the bottom
  requiresHands: false
  requiresCanAccess: false
  contactInteraction: false
  icon: /Textures/Interface/Actions/eyeopen.png
  range: {max: 20}
  effectSuccess:
    popup: Subtle
    sound: {path: /Audio/_Floof/Lewd/blush.ogg}
    soundPerceivedByOthers: false
  action:
    !type:NoOpAction
  hideByRequirement: true
  requirement:
    !type:MobStateRequirement # Don't check out a wall
    inverted: true

# Give someone the finger
- type: Interaction
  id: RudeGesture
  parent: BaseGlobal
  priority: -98 # Move this down since this will be less used
  requiresHands: true
  requiresCanInteract: false
  contactInteraction: false
  icon: /Textures/Interface/AdminActions/tricks.png # kinda a placeholder interface icon
  range: {max: 20}
  effectSuccess:
    popup: Obvious # lets others see like waving, it's funny
    sound: {path: /Audio/Effects/chime.ogg}
    soundPerceivedByOthers: false
  action:
    !type:NoOpAction
  hideByRequirement: true
  requirement:
    !type:MobStateRequirement
    inverted: true

# suggestive gesture, similar to checking out and needs to be subtle and near the bottom
- type: Interaction
  id: SuggestiveGesture
  parent: BaseGlobal
  priority: -99 # Very specific ERP meaning, should be at the bottom
  requiresHands: false
  requiresCanInteract: false
  contactInteraction: false
  icon: /Textures/Interface/Actions/eyeopen.png
  range: {max: 20}
  effectSuccess:
    popup: Subtle
    sound: {path: /Audio/_Floof/Lewd/blush.ogg}
    soundPerceivedByOthers: false
  action:
    !type:NoOpAction
  hideByRequirement: true
  requirement:
    !type:MobStateRequirement # Don't check out a wall
    inverted: true

# Point gun at someone.
- type: Interaction
  id: PointGunAt
  parent: WaveAt
  priority: 3 # Same as "wave at"
  icon: /Textures/Interface/fist.svg.192dpi.png
  allowedSource: ToolVerbs # ToolInteractionVerbsComponent-only.
  effectSuccess:
    popup: Obvious
    sound:
      collection: RiflesPickUp
      params:
        volume: -10
  requirement:
    !type:MobStateRequirement # Target must be a mob
    inverted: true
