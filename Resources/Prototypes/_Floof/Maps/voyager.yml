- type: entity
  id: StationVoyager
  parent: StandardNanotrasenStation
  categories: [ HideSpawnMenu ]
  components:
  - type: GridSpawn
    groups:
      mining: !type:GridSpawnGroup # Floofstation - salvage gets the pathfinder as their shuttle
        paths:
        - /Maps/Floof/Shuttles/Salvage/gausia.yml
        nameGrid: true
        name: Gausia

- type: gameMap
  id: Voyager
  mapName: Voyager
  mapPath: /Maps/Floof/voyager.yml
  minPlayers: 20
  maxPlayers: 60
  stations:
    Voyager:
      stationProto: StationVoyager
      components:
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Floof/Shuttles/Evac/evac_voyager.yml
      - type: StationCargoShuttle
        path: /Maps/Floof/Shuttles/Cargo/cargo_voyager.yml
      - type: StationNameSetup
        mapNameTemplate: '{0} Voyager Station {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'HGI'
      - type: StationJobs
        availableJobs:
            # command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            # service
            Bartender: [ 1, 2 ]
            Botanist: [ 1, 2 ]
            Chef: [ 1, 2 ]
            Janitor: [ 2, 2 ]
            Zookeeper: [ 1, 1 ]
            ServiceWorker: [ 3, 4 ]
            # engineering
            ChiefEngineer: [ 1, 1 ]
            AtmosphericTechnician: [ 1, 2 ]
            StationEngineer: [ 2, 3 ]
            TechnicalAssistant: [ 1, 2 ]
            SeniorEngineer: [ 1, 1 ]
            # medical
            ChiefMedicalOfficer: [ 1, 1 ]
            Chemist: [ 1, 2 ]
            MedicalDoctor: [ 2, 3 ]
            Paramedic: [ 1, 2 ]
            MedicalIntern: [ 1, 2 ]
            Psychologist: [ 1, 1 ]
            Surgeon: [ 1, 1 ]
            SeniorPhysician: [ 1, 1 ]
            # science
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 2, 3 ]
            ResearchAssistant: [ 1, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ForensicMantis: [ 1, 1 ]
            Roboticist: [ 1, 1 ]
            SeniorResearcher: [ 1, 1 ]
            # security
            HeadOfSecurity: [ 1, 1 ]
            Brigmedic: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityTechnician: [ 1, 1 ]
            SecurityOfficer: [ 3, 4 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 1, 2 ]
            Prisoner: [ 3, 5 ]
            PrisonGuard: [ 2, 2 ]
            SeniorOfficer: [ 1, 1 ]
            # justice 
            ChiefJustice: [ 1, 1 ] 
            Clerk: [ 1, 1 ]
            Lawyer: [ 1, 1 ]
            Prosecutor: [ 1, 1 ]
            # supply
            Quartermaster: [ 1, 1 ]
            InventorySpecialist: [ 1, 1 ] 
            SalvageSpecialist: [ 2, 4 ]
            CargoTechnician: [ 2, 4 ]
            Courier: [ 1, 2 ]
            # civilian
            Passenger: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Reporter: [ 1, 2 ]
            # silicon
            StationAi: [ 1, 1 ]
            Borg: [ 2, 3 ]