- type: entity
  parent: [ClothingEyesBase]
  id: ClothingEyesNeuralyzer
  name: Mesmerizer
  description: A flash-based recreational hypnosis tool developed by Euphoria LLC based on Hypnotech sleepwear technology. Has a very... loyal user base.
  components:
    - type: Sprite
      sprite: _Euphoria/Clothing/Eyes/Hud/neuralyzer.rsi
    - type: Clothing
      sprite: _Euphoria/Clothing/Eyes/Hud/neuralyzer.rsi
    - type: Brainwasher

- type: entity
  parent: [ClothingEyesBase]
  id: ClothingEyesSyndilyzer
  name: Syndicate Hypnovisor
  description: The syndicate's pet project in hypnosis therapy, adapted from Euphoria-developed prototypes. It has multiple strength settings, ranging from mild hypnosis to full brainwashing - but all of them have the potential to eventually be permanent should the subject be willing.
  components:
    - type: Sprite
      sprite: _Euphoria/Clothing/Eyes/Hud/syndilyzer.rsi
    - type: Clothing
      sprite: _Euphoria/Clothing/Eyes/Hud/syndilyzer.rsi
    - type: Brainwasher

- type: entity
  id: ActionOpenCompulsionsMenu
  name: View Compulsions
  description: Review the warm fuzzy compulsions embracing your mind.
  components:
    - type: Action
      priority: -3
      itemIconStyle: NoItem
      icon:
        sprite: _Euphoria/Interface/Actions/actions_hypno.rsi
        state: compulsions
      useDelay: 0.5
    - type: InstantAction
      event: !type:OpenCompulsionsMenuAction
