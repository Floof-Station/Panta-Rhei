# All of these entities were added on Euph
# Most of these entities are just regex-replacements of the ones in suits.yml
#
# Used replacements:
# 1. "_HL/Clothing/Bunnysuit/Suits/(\w+).rsi" -> "_HL/Clothing/Bunnysuit/Socks/$1.rsi"
# 2. "id: Bunnysuit(\w+)" -> "id: ClothingUndergarmentSocksBunnysuit$1"
# 3. "name: ([^.$]*) bunny ?suit" -> "name: $1 bunnysuit socks"
# 4. "parent: BunnysuitBase" -> "parent: ClothingUndergarmentSocksBunnysuitBase"

- type: entity
  parent: ClothingUndergarmentSocksBase
  id: ClothingUndergarmentSocksBunnysuitBase
  abstract: true
  description: The socks part of a bunny suit.
  components:
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
    - Bunnysuit

