# This should be on every other fishing table
- type: entityTable
  id: BasicFishingLootTable
  table: !type:GroupSelector
    children:
    # 75% chance of scrap of some kind - Euphoria 65% added larger scrap
    - !type:GroupSelector
      weight: 65
      children:
      - !type:NestedSelector
        tableId: SalvageScrapLowValue
        weight: 40
      - !type:NestedSelector
        tableId: SalvageScrapHighValue
        weight: 35
      - !type:NestedSelector
        tableId: SalvageScrapLarge
        weight: 25
    # 15% chance of some trash - Euphoria 10%
    - !type:NestedSelector
      tableId: GenericTrashItems
      weight: 10
    # 10% chance of low-value treasure or maintenance tools - Euphoria 20% added higher value loot
    - !type:GroupSelector
      weight: 20
      children:
      - !type:NestedSelector
        tableId: SalvageTreasureCommon
        weight: 40
      - !type:NestedSelector
        tableId: SalvageTreasureUncommon
        weight: 30
      - !type:NestedSelector
        tableId: SalvageTreasureRare
        weight: 15
      - !type:NestedSelector
        tableId: MaintToolsTable
        weight: 15
    # Euphoria 5% chance of rare shit or contraband
    - !type:GroupSelector
      weight: 5
      children:
      - !type:NestedSelector
        tableId: SalvageTreasureLegendary
        weight: 90
      - !type:NestedSelector
        tableId: SyndieFishingLoot
        weight: 10

# All types of the rare and unique fishes
- type: entityTable
  id: RareFishTable
  table: !type:GroupSelector
    children:
    - id: FishAlien
    - id: FishBingle
    - id: FishBoyFisher
    - id: FishNukeDisk
    - id: FishGib
    - id: FishMutant
    - id: FishNuker
    - id: FishToxic
    - id: FishIan

# Fish from water
- type: entityTable
  id: WaterFishTable
  table: !type:GroupSelector
    children:
    - id: FishAngler
    - id: FishBass
    - id: FishBlob
    - id: FishBlueFintuna
    - id: FishCat
    - id: FishTropicalClown
    - id: FishPuffer
    - id: FishSilver
    - id: FishTropicalSun
    - id: FishTropical

# Items from Water
- type: entityTable
  id: WaterFishingLootTable
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
        tableId: BasicFishingLootTable
        weight: 70
      - !type:NestedSelector
        tableId: WaterFishTable
        weight: 20
      - !type:NestedSelector
        tableId: RareFishTable
        weight: 10

# Items from Lava
- type: entityTable
  id: LavaFishingLootTable
  table: !type:GroupSelector
    children:
      # TODO: lava/plasma fish
      - !type:NestedSelector
        tableId: BasicFishingLootTable

# Items from Plasma
- type: entityTable
  id: PlasmaFishingLootTable
  table: !type:GroupSelector
    children:
    # TODO: lava/plasma fish
      - !type:NestedSelector
        tableId: BasicFishingLootTable

# Items from Toilets
- type: entityTable
  id: ToiletFishingLootTable
  table: !type:GroupSelector
    children:
      # like water but no rare fishes
      - !type:NestedSelector
        tableId: BasicFishingLootTable
        weight: 80
      - !type:NestedSelector
        tableId: WaterFishTable
        weight: 20

# Euphoria rare contraband loot
- type: entityTable
  id: SyndieFishingLoot
  table: !type:GroupSelector
    children:
    - id: ClothingBackpackDuffelSyndicate
    - id: CyberPen
    - id: CigCartonSyndicate
    - id: ClothingBeltMilitaryWebbing
    - id: ClothingShoesBootsCombatFilled
    - id: ToolboxSyndicateFilled
    - id: ClothingHandsKnuckleDustersSyndicate
    - id: MedkitCombatFilled
