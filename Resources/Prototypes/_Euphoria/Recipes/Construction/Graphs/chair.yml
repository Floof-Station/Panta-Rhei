- type: constructionGraph
  id: HumanLeatherArmchair
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity {}
    edges:
    - to: HumanLeatherArmchair
      steps:
      - material: Steel
        amount: 1
        doAfter: 1
      - material: HumanLeather
        amount: 2

  - node: HumanLeatherArmchair
    entity: HumanLeatherArmchair
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 1
      - !type:SpawnPrototype
        prototype: MaterialHumanLeather1
        amount: 2
      steps:
      - tool: Screwing
        doAfter: 1
