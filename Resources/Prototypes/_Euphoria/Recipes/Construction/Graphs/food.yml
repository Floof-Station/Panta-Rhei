- type: constructionGraph
  id: DoughBuns
  start: start
  graph:
    - node: start
      edges:
        - to: burgerBun
          steps:
            - tag: DoughSlice
              name: crafting-material-dough-slice
              icon:
                sprite: Objects/Consumable/Food/ingredients.rsi
                state: dough-slice
              doAfter: 0.5
        - to: hotdogBun
          steps:
            - tag: DoughSlice
              name: crafting-material-dough-slice
              icon:
                sprite: Objects/Consumable/Food/ingredients.rsi
                state: dough-slice
              doAfter: 0.5
    - node: burgerBun
      entity: FoodUncookedBun
    - node: hotdogBun
      entity: FoodUncookedHotdogBun

- type: constructionGraph
  id: ShrimpCooked
  start: start
  graph:
    - node: start
      edges:
        - to: cooked shrimp
          completed:
            - !type:PlaySound
              sound: /Audio/Effects/sizzle.ogg
          steps:
            - minTemperature: 335

    - node: cooked shrimp
      entity: FoodMeatShrimpCooked

- type: constructionGraph
  id: UnusualShrimpCooked
  start: start
  graph:
    - node: start
      edges:
        - to: cooked unusual shrimp
          completed:
            - !type:PlaySound
              sound: /Audio/Effects/sizzle.ogg
          steps:
            - minTemperature: 335

    - node: cooked unusual shrimp
      entity: FoodMeatShrimpUnusualCooked
