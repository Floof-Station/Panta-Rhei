# Follows the specified target, or idles around if the target is unreachable or absent
- type: htnCompound
  id: FollowOrIdleCompound
  branches:
  # Try to find food if hungry or thirsty
  - tasks:
    - !type:HTNCompoundTask
      task: FoodCompound

  # Try to follow the target if the key is specified
  - preconditions:
    - !type:KeyExistsPrecondition
      key: FollowTarget
    tasks:
    - !type:HTNCompoundTask
      task: FollowCompound

  # Fall back to idling around
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
