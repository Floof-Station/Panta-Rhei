# Changelog - 
# Removed Cockroaches
# Pets understand Tau Ceti but can't speak it
# added 4 new pets including cortical borer for kink reasons

- type: entity
  parent: MobHamster
  id: MobHamsterPet
  components:
  - type: NpcFactionMember
    factions:
      - Critter
  - type: LanguageKnowledge
    speaks:
    - Mouse
    understands:
    - TauCetiBasic
    - Mouse
  - type: GhostTakeoverAvailable
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-hamster-name
    description: ghost-role-information-pet-description
    rules: ghost-role-information-familiar-rules
