- type: entity
  name: Silicon PDW-9
  parent: BaseWeaponBatterySmall
  id: WeaponEnergyGunPistolBorg
  description: The core of a military sidearm redesigned to fit silicons. Due to necessary design changes it's firerate, damage and capacity are reduced.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Battery/energygun_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mode-disabler
      shader: unshaded
      map: [ "Firemode" ]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Battery/multiphase_energygun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
    fireRate: 1.3
  - type: Battery
    maxCharge: 350
    startingCharge: 350
  - type: BatterySelfRecharger
    autoRechargeRate: 10
  - type: BatteryAmmoProvider
    proto: BulletEnergyGunLaserBorg
    fireCost: 50
  - type: EnergyGun
    fireModes:
    - proto: BulletEnergyGunLaserBorg
      fireCost: 50
      name: lethal
      state: lethal
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EnergyGunFireModeVisuals.State:
        Firemode:
          Lethal: { state: mode-lethal }
  - type: StaticPrice
    price: 750