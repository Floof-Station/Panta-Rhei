- type: entity
  id: BorgModuleSecurityKill
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: lethal force cyborg module
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: security
    - state: icon-kill
  - type: ItemBorgModule
    hands:
    - item: WeaponPistolMk88
    - item: CombatKnife
  - type: BorgModuleIcon
    icon: { sprite: _Euphoria/Interface/Actions/actions_borg.rsi, state: kill-module}

- type: entity
