- type: entity
  id: BorgModuleSecurityKill
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: lethal force cyborg module
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: security
    - state: icon-kill
  - type: ItemBorgModule
    hands:
    - item: WeaponPistolMk58
    - item: CombatKnife
    - item: MagazinePistol
      hand:
        emptyRepresentative: MagazinePistol
        emptyLabel: borg-slot-magazine-empty
        whitelist:
          tags:
          - MagazinePistol
          - MagazineBox
  - type: BorgModuleIcon
    icon: { sprite: _Euphoria/Interface/Actions/actions_borg.rsi, state: kill-module}

