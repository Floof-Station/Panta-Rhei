- type: entity
  id: BorgModuleSecurityKill
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: lethal force cyborg module
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: security
    - state: icon-kill
  - type: ItemBorgModule
    hands:
    - item: WeaponPistolMk88
    - item: CombatKnife
  - type: BorgModuleIcon
    icon: { sprite: _Euphoria/Interface/Actions/actions_borg.rsi, state: kill-module}


- type: entity
  id: BorgModuleSecurityAdvancedMeasures
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: advanced combat cyborg module
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Robotics/borgmodule.rsi
    layers:
    - state: security
    - state: icon-Advmeasures
  - type: ItemBorgModule
    hands:
    - item: BorgWeaponXrayCannon
    icon: { sprite: _Euphoria/Interface/Actions/actions_borg.rsi, state: advmeasures-module}
