# ================================================================================================
# Topicals

# Placeholder oilpack because i can't be fucked to port the ones from FarHorizons (which require changes to the healing system and more)
- type: entity
  name: oil pack
  description: Contains a small amount of space lubricant that can substitute normal IPC oil.
  parent: Bloodpack
  id: BloodpackOil
  components:
  - type: Healing
    damageContainers:
    - Robotic
    damage:
      types:
        Bloodloss: -10 # Since IPCs do not naturally heal from bloodloss
    modifyBloodLevel: 30 # about 1/0 of the blood pool of an average humanoid
    delay: 6 # about 2x than long as normal ones
  - type: Stack
    stackType: BloodpackOil
    count: 10

- type: entity
  parent: BloodpackOil
  id: BloodpackOil1
  suffix: Single
  components:
  - type: Stack
    count: 1

# ================================================================================================
# Pills
- type: entity
  name: Libidozenithizine pill
  parent: Pill
  id: PillLibidozenithizine
  components:
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 20
          reagents:
            - ReagentId: Libidozenithizine
              Quantity: 10

- type: entity
  name: space station rhino pill
  parent: Pill
  id: PillLibidozenithizineRhino
  components:
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 50
          reagents:
            - ReagentId: Libidozenithizine # This will most likely kill you
              Quantity: 50

- type: entity
  parent: PresentRandom
  id: RhinoPillbox
  name: space station rhino pill box
  description: A box containing a "Space Station Rhino Pill". The flashy labeling claims it lasts a whole day and allegedly "no headache". There's a small disclaimer on the back, but it's so small that it's completely illegible.
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
      - state: fig_box
  - type: SpawnItemsOnUse
    items:
      - id: MysteryFigureBoxTrash
      - id: PillLibidozenithizineRhino
