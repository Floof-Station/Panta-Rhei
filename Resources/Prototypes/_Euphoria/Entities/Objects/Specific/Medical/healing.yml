# ================================================================================================
# Topicals

# Placeholder oilpack because i can't be fucked to port the ones from FarHorizons (which require changes to the healing system and more)
- type: entity
  name: oil pack
  description: Contains a small amount of space lubricant that can substitute normal IPC oil.
  parent: Bloodpack
  id: BloodpackOil
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Medical/oilpack.rsi
    state: icon 
  - type: Item
    sprite: _Euphoria/Objects/Specific/Medical/oilpack.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        shader: shaded
      right:
      - state: inhand-right
        shader: shaded
  - type: Healing
    damageContainers:
    - Robotic
    damage:
      # types:# Bloodloss: -10 # Since IPCs do not naturally heal from bloodloss
      Bloodloss: -7.5 # Welding should be what stops bloodloss, and IPCs (at least mine?) do heal a bit of bloodloss damage about 70-75% oil level, but let's be nice.
    modifyBloodLevel: 30 # about 1/0 of the blood pool of an average humanoid
    delay: 6 # about 2x than long as normal ones
  - type: Stack
    stackType: BloodpackOil
    count: 10
  - type: StackPrice
    price: 2 # I suppose oil is more common than blood. This is mainly to avoid exploding the cost of the robotech restock.
  - type: Tag
    tags:
    - IPCrepairkit

- type: entity
  parent: BloodpackOil
  id: BloodpackOil1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  parent: BloodpackOil
  id: BloodpackOil5
  suffix: Half-Full
  components:
  - type: Stack
    count: 5

- type: entity
  name: synthblood pack
  description: Contains a small amount of synthetic blood, great for who needs it, for others it might just do the job.
  parent: BloodpackOil
  id: BloodpackSynth
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Specific/Medical/synthpack.rsi
    state: icon 
  - type: Item
    sprite: _Euphoria/Objects/Specific/Medical/synthpack.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        shader: shaded
      right:
      - state: inhand-right
        shader: shaded
  - type: Stack
    stackType: BloodpackSynth
    count: 10
  - type: StackPrice
    price: 5
  - type: Healing
    damageContainers:
      - Biological
      # - BiologicalMechanical # Cooking for later
      - Robotic
    damage:
      types:
        Bloodloss: -5 #lowers bloodloss damage 
    modifyBloodLevel: 25 #restores about 8% blood per use on standard humanoids.
    delay: 5 # near 2x than long as normal ones
  - type: Tag
    tags:
    - IPCrepairkit
    - Bloodpack

- type: entity
  parent: BloodpackSynth
  id: BloodpackSynth1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  parent: BloodpackSynth
  id: BloodpackSynth5
  suffix: Half-Full
  components:
  - type: Stack
    count: 5

# ================================================================================================
# Pills
- type: entity
  name: Libidozenithizine pill
  parent: Pill
  id: PillLibidozenithizine
  components:
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 20
          reagents:
            - ReagentId: Libidozenithizine
              Quantity: 10

- type: entity
  name: space station rhino pill
  parent: Pill
  id: PillLibidozenithizineRhino
  components:
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 50
          reagents:
            - ReagentId: Libidozenithizine # This will most likely kill you
              Quantity: 50

- type: entity
  parent: PresentRandom
  id: RhinoPillbox
  name: space station rhino pill box
  description: A box containing a "Space Station Rhino Pill". The flashy labeling claims it lasts a whole day and allegedly "no headache". There's a small disclaimer on the back, but it's so small that it's completely illegible.
  components:
  - type: Sprite
    sprite: Objects/Fun/figurines.rsi
    layers:
      - state: fig_box
  - type: SpawnItemsOnUse
    items:
      - id: MysteryFigureBoxTrash
      - id: PillLibidozenithizineRhino
