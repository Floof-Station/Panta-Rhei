- type: entity
  name: corpsman medical pouch
  id: SecurityMedicalPouch
  parent: [ MedicalPouch ]
  description: A small pouch in security colours for pills, bottles, autoinjectors, and syringes.
  components:
  - type: Sprite
    sprite: _NF/Objects/Storage/Pouches/pouch_small.rsi
    layers:
    - state: base
      color: "#353535"
    - state: closed
      map: [ "closeLayer" ]
      color: "#353535"
    - state: open
      map: [ "openLayer" ]
      color: "#353535"
      visible: false
    - state: inside
      map: ["insideLayer"]
      visible: false
    - state: fill-chem-1
      map: [ "pouchFill1" ]
      visible: false
    - state: fill-chem-2
      map: [ "pouchFill2" ]
      visible: false
    - state: fill-chem-3
      map: [ "pouchFill3" ]
      visible: false
    - state: fill-chem-4
      map: [ "pouchFill4" ]
      visible: false
    - state: decal-line-01
      map: [ "decal1" ]
      color: "#2f74b8"
    - state: decal-med-cross
      map: [ "decal2" ]
      color: "#860000"
  - type: Clothing
    sprite: _NF/Objects/Storage/Pouches/pouch_small.rsi
    clothingVisuals:
      belt:
      - state: equipped-BELT
        color: "#353535"
      pocket:
      - state: equipped-BELT
        color: "#353535"
  - type: Item
    size: Small
    sprite: _NF/Objects/Storage/Pouches/pouch_small.rsi
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#353535"
      right:
      - state: inhand-right
        color: "#353535"
