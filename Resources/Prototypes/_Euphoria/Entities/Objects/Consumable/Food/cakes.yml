# blackberry cake
- type: entity
  name: blackberry cake
  parent: FoodCakeBase
  id: FoodCakeBlackberry
  description: Stains your teeth.
  components:
  - type: Sprite
    layers:
    - state: plain
    - state: alpha-filling
      color: black
  - type: SliceableFood
    slice: FoodCakeBlackberrySlice
  - type: Tag
    tags:
    - Cake
    - Fruit
  - type: Item
    inhandVisuals:
      left:
      - state: plain-inhand-left
      - state: alpha-filling-inhand-left
        color: black
      right:
      - state: plain-inhand-right
      - state: alpha-filling-inhand-right
        color: black

- type: entity
  name: blackberry cake slice
  parent: FoodCakeSliceBase
  id: FoodCakeBlackberrySlice
  description: Stains your teeth.
  components:
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: black
  - type: Tag
    tags:
    - Cake
    - Fruit
    - Slice
  - type: Item
    inhandVisuals:
      left:
      - state: plain-slice-inhand-left
      - state: alpha-slice-filling-inhand-left
        color: black
      right:
      - state: plain-slice-inhand-right
      - state: alpha-slice-filling-inhand-right
        color: black

# blueberry cake is a base game food so will skip it here

