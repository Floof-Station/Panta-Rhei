- type: entity
  parent: FoodBreadSliceBase
  id: FoodUncookedBun
  name: uncooked bun
  description: Dough shaped into a burger bun.
  components:
    - type: Sprite
      sprite: _Euphoria/Objects/Consumable/Food/burger.rsi
      state: uncooked-bun
    - type: Construction
      graph: DoughBuns
      node: burgerBun
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 10
          reagents:
            - ReagentId: Nutriment
              Quantity: 6.66 # 1/3 of a loaf of bread, technically losing 0.01 nutriment per batch of three buns over making bread loaves/slices

- type: entity
  name: shrimp burger
  parent: FoodBurgerBase
  id: FoodBurgerShrimp
  description: A pile of shrimp, slapped in between a bun.
  components:
    - type: FlavorProfile
      flavors:
        - bun
        - shrimp
    - type: Sprite
      sprite: _Euphoria/Objects/Consumable/Food/shrimp.rsi
      state: burger
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 15
          reagents:
            - ReagentId: Nutriment
              Quantity: 4
            - ReagentId: Protein
              Quantity: 5
            - ReagentId: Vitamin
              Quantity: 4
    - type: Tag
      tags:
        - Meat
