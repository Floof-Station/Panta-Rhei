# base cake
- type: entity
  abstract: true
  parent: FoodPieBase
  id: EuphoriaFoodBasePie
  description: Tastes good enough to make a grown man cry.
  components:
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/berry_food.rsi
    state: blackberrypie
  - type: SliceableFood
    slice: FoodPieBlackberrySlice
  - type: Tag
    tags:
    - Fruit
    - Pie

# base slice
- type: entity
  parent: FoodPieAppleSlice
  id: EuphoriaFoodBasePieSlice
  abstract: true
  description: Stains your teeth.
  components:
  - type: FlavorProfile
    flavors:
    - sweet

# blackberry
- type: entity
  name: blackberry pie
  parent: EuphoriaFoodBasePie
  id: FoodPieBlackberry
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/berry_food.rsi
    state: blackberrypie
  - type: SliceableFood
    slice: FoodPieBlackberrySlice

- type: entity
  name: slice of blackberry pie
  parent: EuphoriaFoodBasePieSlice
  id: FoodPieBlackberrySlice
  components:
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: black

