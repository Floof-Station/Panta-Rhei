- type: entity
  parent: FoodBreadSliceBase
  id: FoodUncookedHotdogBun
  name: uncooked hotdog bun
  description: Dough shaped into a hotdog bun.
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/hotdog.rsi
    layers:
    - state: uncooked-hotdog-bun
  - type: Construction
    graph: DoughBuns
    node: hotdogBun
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 6.66 # 1/3 of a loaf of bread, technically losing 0.01 nutriment per batch of three buns over making bread loaves/slices

- type: entity
  parent: FoodMealBase
  id: FoodHotdogBun
  name: hotdog bun
  description: A perfect warm bun for a juicy sausage.
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/hotdog.rsi
    layers:
    - state: hotdog-bun
    - map: [ "foodSequenceLayers" ]
    - state: hotdog-bun
  - type: FoodSequenceStartPoint
    key: Hotdog
    maxLayers: 6
    startPosition: -0.15, 0
    offset: 0.15, 0
    minLayerOffset: 0, 0
    maxLayerOffset: 0, 0.05
    nameGeneration: food-sequence-hotdog-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
    onlyFinal: false
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 6.66 # 1/3 of a loaf of bread, technically losing 0.01 nutriment per batch of three buns over making bread loaves/slices

