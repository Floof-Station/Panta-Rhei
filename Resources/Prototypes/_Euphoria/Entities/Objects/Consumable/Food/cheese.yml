- type: entity
  name: mother's cheese wheel
  parent: FoodBakingBase
  id: FoodMothersCheese
  description: A big wheel of fresh Mother's cheese. Made with love <3.
  components:
  - type: FlavorProfile
    flavors:
    - cheesy
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/mothers_cheese.rsi
    state: cheesewheel
  - type: SliceableFood
    count: 3
    slice: FoodMothersCheeseSlice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 18
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: BreastMilk
          Quantity: 5

- type: entity
  parent: FoodBakingBase
  id: FoodMothersCheeseSlice
  name: mother's cheese wedge
  description: A wedge of fresh Mother's cheese. The cheese wheel it was cut from can't have gone far. Made with love <3.
  components:
  - type: FlavorProfile
    flavors:
    - cheesy
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/mothers_cheese.rsi
    state: cheesewedge
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: BreastMilk
          Quantity: 2
  - type: Tag
    tags:
    - Slice
  - type: FoodSequenceElement
    entries:
      Taco: CheeseTaco
      Burger: CheeseBurger
      Nachos: CheeseTaco # DeltaV
      Hotdog: CheeseBurger # Euphoria
  - type: Item
    size: Tiny
    storedOffset: 0,-3
    inhandVisuals:
      left:
      - state: cheesewedge-inhand-left
      right:
      - state: cheesewedge-inhand-right
