- type: entity
  name: plasma applicator kit
  description: A neat applicator that applies plasma to an IPC or borg without having to handle a dangerous material bare-handed.
  parent: Basekititem
  id: Plasmarepairkit
  suffix: Full
  components:
  - type: Sprite
    state: plasmarepairkit
  - type: Item
    heldPrefix: plasmarepairkit
  - type: Construction
    graph: Plasmarepairkit
    node: plasmarepairkit
  - type: Extractable
    grindableSolutionName: plasmarepairkit
  - type: SolutionContainerManager
    solutions:
      plasmarepairkit:
        reagents:
        - ReagentId: Plasma
          Quantity: 3
        - ReagentId: Fersilicite
          Quantity: 2
  - type: ConditionalHealing
    healingDefinitions:
      - allowedTags: [ IPC ]
        healing:
          damageContainers:
          - Robotic
          - Silicon
          delay: 1.2
          damage:
            types:
              Poison: -20
              Radiation: -20
          adjustEyeDamage: -1
          healingBeginSound:
            # path: "/Audio/Items/Flare/flare_on.ogg"
            path: "/Audio/Items/Medical/brutepack_begin.ogg"
            params:
              volume: 1.0
              variation: 0.125
          healingEndSound:
            # path: "/Audio/Items/Stamp/automatic_stamp.ogg"
            path: "/Audio/Items/Medical/brutepack_end.ogg"
            params:
              volume: 1.0
              variation: 0.125
  - type: Stack
    stackType: Plasmarepairkit
    count: 10
  - type: StackPrice
    price: 10

- type: entity
  id: Plasmarepairkit1
  parent: Plasmarepairkit
  suffix: Single
