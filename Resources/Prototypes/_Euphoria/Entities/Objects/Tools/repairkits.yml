- type: entity
  parent: BaseItem
  id: Basekititem
  abstract: true
  components:
  - type: Tag
    tags:
    - IPCrepairkit
  - type: Sprite
    sprite: _Euphoria/Objects/Tools/repairkit.rsi
  - type: Item
    size: Small
    sprite: _Euphoria/Objects/Tools/repairkit.rsi
    heldPrefix: cablerepairkit
  - type: StaticPrice
    price: 0
  - type: PhysicalComposition
    materialComposition:
      Steel: 15

- type: entity
  name: cable repair kit
  description: A bundle of pre-managed cables designed to rewire an IPC or borg more efficiently.
  parent: Basekititem
  id: Cablerepairkit
  suffix: Full
  components:
  - type: Sprite
    state: cablerepairkit
  - type: Item
    heldPrefix: cablerepairkit
  - type: Construction
    graph: Cablerepairkit
    node: cablerepairkit
  - type: Extractable
    grindableSolutionName: cablerepairkit
  - type: SolutionContainerManager
    solutions:
      cablerepairkit:
        reagents:
        - ReagentId: Iron
          Quantity: 3
        - ReagentId: Copper
          Quantity: 2
  - type: ConditionalHealing
    healingDefinitions:
      - allowedTags: [ IPC ]
        healing:
          damageContainers:
          - Robotic
          - Silicon
          delay: 2.3
          damage:
            types:
              Heat: -5
              Cold: -5
              Shock: -5
              Caustic: -1.5
          healingBeginSound:
            # path: "/Audio/Items/multitool_drop.ogg"
            path: "/Audio/Items/Medical/brutepack_begin.ogg"
            params:
              volume: 1.0
              variation: 0.125
          healingEndSound:
            # path: "/Audio/Items/wirecutter.ogg"
            path: "/Audio/Items/Medical/brutepack_end.ogg"
            params:
              volume: 1.0
  - type: Stack
    stackType: Cablerepairkit
    count: 10
  - type: StackPrice
    price: 10

- type: entity
  id: Cablerepairkit1
  parent: Cablerepairkit
  suffix: Single
  components:
  - type: Stack
    stackType: Cablerepairkit
    count: 1

- type: entity
  id: Cablerepairkit5
  parent: Cablerepairkit
  suffix: Half-Full
  components:
  - type: Stack
    stackType: Cablerepairkit
    count: 5

- type: entity
  name: advanced cable repair kit
  description: A bundle of pre-managed cables designed to rewire an IPC or borg more efficiently.
  parent: Basekititem
  id: AdCablerepairkit
