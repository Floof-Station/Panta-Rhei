# perfumes, we won't cover any but just a couple of em
- type: entity
  parent: BaseItem
  id: BasePerfume
  abstract: true
  categories: [ HideSpawnMenu ]
  name: base perfume
  components:
  - type: PopUpOnUse # we can set our pop up on use here so we can stop duplicating
    popUpDoAfterTime: 2
    userPopUpMsg: perfume-self-success
    targetPopUpMsg: perfume-target-success
    popUpDoAfterSound:
      path: /Audio/Effects/spray3.ogg
    repeat: false
    whitelist:
      components:
      - MobState
      - Clothing

- type: entity
  parent: BasePerfume
  id: PerfumeBlueberry
  name: blueberry perfume
  description: A bottle of blueberry-scented perfume.
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Misc/perfume.rsi
    scale: 0.7, 0.7
    layers:
    - state: fill
      color: "#703BE7"
    - state: base
  - type: PopUpOnUse
    effects:
    - !type:ApplyScentEffect
      scent: Blueberry

