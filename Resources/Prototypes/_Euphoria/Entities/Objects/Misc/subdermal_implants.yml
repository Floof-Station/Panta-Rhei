# Preserved from DV upstream merge
- type: entity
  parent: BaseSubdermalImplant
  id: MedicalTrackingImplant
  categories: [ HideSpawnMenu ]
  name: medical tracking implant
  description: This implants transmits a message on the medical channel in case the user goes into critical state or dies.
  components:
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
    - Dead
  - type: RattleOnTrigger
    targetUser: true
    radioChannel: Medical

- type: entity
  parent: BaseImplantOnlyImplanter
  id: MedicalTrackingImplanter
  name: medical tracking implanter
  components:
  - type: Implanter
    implant: MedicalTrackingImplant

- type: entity #Euphoria | A Dna scrambler that despawns if not used.
  parent: DnaScramblerImplant
  id: DnaScramblerImplantDespawning
  name: DNA scrambler implant (despawning)
  description: This implant lets the user randomly change their appearance and name once. The implant will dissolve if not used quickly.
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 120
