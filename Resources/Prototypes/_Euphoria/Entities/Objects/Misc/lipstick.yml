- type: entity
  parent: BaseItem
  id: BaseLipStick
  abstract: true
  categories: [ HideSpawnMenu ]
  name: base lip stick
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Euphoria/Objects/Misc/lipstick.rsi
    scale: 0.7, 0.7
    layers:
    - state: lipstick_uncap_color
      color: "#E3D7E3"
    - state: lipstick_uncap
  - type: Sealable
  - type: Openable
    sound:
      path: /Audio/Effects/pop_high.ogg
    closeable: true
    closeSound:
      path: /Audio/Effects/pop_high.ogg
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: { state: "lipstick_uncap_color" , color: "#E3D7E3" }
          False: { state: "lipstick" , color: "#E3D7E3" }
  - type: PopUpOnUse
    popUpDoAfterTime: 5
    userPopUpMsg: lipstick-self-success
    targetPopUpMsg: lipstick-target-success
    popUpDoAfterSound:
      path: /Audio/Items/Paper/paper_scribble1.ogg
      params:
        pitch: 0.7
        variation: 0.08
    repeat: false
    whitelist:
      components:
      - MobState
      - Clothing
    effects:
    - !type:AddFaceMarkingEffect
      marking: LipStick
      color: "#FF0000"
      organ: Head
      layer: Face

