- type: entity
  parent: BaseItem
  id: LipStickMakeupCloth
  name: Makeup Cloth
  description: A small cloth used to remove makeup.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/rag.rsi
    state: rag
  - type: PopUpOnUse
    popUpDoAfterTime: 5
    userPopUpMsg: lipstick-removal-self-success
    targetPopUpMsg: lipstick-removal-target-success
    popUpDoAfterSound:
      path: /Audio/Effects/Fluids/splat.ogg
    repeat: false
    whitelist:
      components:
      - MobState
      - Clothing
    effects:
    - !type:AddFaceMarkingEffect
      marking: LipStick
      remove: true
      organ: Head
      layer: Face
  - type: Construction
    graph: MakeupCloth
    node: makeupcloth
