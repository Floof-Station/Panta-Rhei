
- type: entity
  parent: BaseItem
  id: FloorCarpetItemMetamorphic
  name: metamorphic carpet packet
  description: A packet of special carpet that can be given any colour once.
  components:
  - type: Sprite
    sprite: Objects/Tiles/tile.rsi
    state: carpetclown
  - type: Item
    sprite: Objects/Tiles/tile.rsi
    size: Normal
    heldPrefix: carpet-white
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Transmutable
    delay: 0.5
    availablePrototypes:
    - FloorCarpetItemRedFull
    - FloorCarpetItemBlackFull
    - FloorCarpetItemBlueFull
    - FloorCarpetItemGreenFull
    - FloorCarpetItemOrangeFull
    - FloorCarpetItemSkyBlueFull
    - FloorCarpetItemPurpleFull
    - FloorCarpetItemPinkFull
    - FloorCarpetItemCyanFull
    - FloorCarpetItemWhiteFull
  - type: UserInterface
    interfaces:
      enum.TransmutableUiKey.Key:
        type: TransmutableBoundUserInterface
  - type: ActivatableUI
    key: enum.TransmutableUiKey.Key
  - type: StaticPrice
    price: 150

- type: entity
  parent: FloorCarpetItemRed
  id: FloorCarpetItemRedFull
  suffix: Item, Full
  components:
  - type: Stack
    count: 30

