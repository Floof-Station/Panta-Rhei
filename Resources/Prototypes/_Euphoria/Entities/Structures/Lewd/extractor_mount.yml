# The classic mount with storage tank
- type: entity
  name: breeding mount
  id: BaseBreedingMount
  abstract: true
  parent: ChairBase
  description: A cushioned tube with an inviting hole. It's mounted to a stand and features a grab bar.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 150
        mask:
        - TableMask
  - type: Strap
    position: Stand
    buckleOffset: "0.0,-0.3"
    facing: 180
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StorageTank
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 2
            max: 5
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Pullable
  - type: Edible
    edible: Drink
    destroyOnEmpty: false
    utensil: None
    solution: semenstorage
  - type: SolutionContainerManager
    solutions:
      semenstorage:
        maxVol: 100
  - type: SolutionTransfer
    transferAmount: 30
    maxTransferAmount: 100
    minTransferAmount: 10
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Spillable
    solution: semenstorage
  - type: DrawableSolution
    solution: semenstorage
  - type: RefillableSolution
    solution: semenstorage
  - type: DrainableSolution
    solution: semenstorage
  - type: ExaminableSolution
    solution: semenstorage
  - type: StaticPrice
    price: 100

