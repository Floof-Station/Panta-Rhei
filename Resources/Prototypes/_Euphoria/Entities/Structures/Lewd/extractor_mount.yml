# Flatpacks
- type: entity
  parent: BaseFlatpack
  id: ExtractorsFlatpack
  abstract: true
  name: extractor flatpack
  description: A flatpack used for constructing something.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    layers:
    - state: extractor

- type: entity
  parent: ExtractorsFlatpack
  id: BreedingMountFlatpackBlue
  name: breeding mount flatpack
  description: A flatpack used for constructing a breeding mount.
  components:
  - type: Flatpack
    entity: BreedingMountBlue

- type: entity
  parent: ExtractorsFlatpack
  id: BreedingMountFlatpackPurple
  name: breeding mount flatpack
  description: A flatpack used for constructing a breeding mount.
  components:
  - type: Flatpack
    entity: BreedingMountPurple

- type: entity
  parent: ExtractorsFlatpack
  id: BreedingMountFlatpackRed
  name: breeding mount flatpack
  description: A flatpack used for constructing a breeding mount.
  components:
  - type: Flatpack
    entity: BreedingMountRed

- type: entity
  parent: ExtractorsFlatpack
  id: BreedingMountFlatpackTeal
  name: breeding mount flatpack
  description: A flatpack used for constructing a breeding mount.
  components:
  - type: Flatpack
    entity: BreedingMountTeal

- type: entity
  parent: ExtractorsFlatpack
  id: BreedingMountFlatpackYellow
  name: breeding mount flatpack
  description: A flatpack used for constructing a breeding mount.
  components:
  - type: Flatpack
    entity: BreedingMountYellow

# Table for random colour selection
- type: entityTable
  id: BreedingMounts
  table: !type:GroupSelector
    children:
    - id: BreedingMountFlatpackBlue
    - id: BreedingMountFlatpackPurple
    - id: BreedingMountFlatpackRed
    - id: BreedingMountFlatpackTeal
    - id: BreedingMountFlatpackYellow

# Cargo crate for breeding mounts
- type: entity
  id: CrateBreedingMount
  parent: CrateLewd
  name: breeding mount crate
  description: Relief or research, either way this crate contains a valuable tool the crew is sure to enjoy.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: BreedingMounts
          rolls: 1
        - id: Multitool
          amount: 1

# Catalogue order for the breeding mount crate
- type: cargoProduct
  id: CrateBreedingMountOrder
  icon:
    sprite: Objects/Devices/flatpack.rsi
    state: extractor
  product: CrateBreedingMount
  cost: 1000
  category: cargoproduct-category-name-fun
  group: market

# Box for toy vendor
- type: entity
  parent: WrappedParcel
  id: BreedingMountVendBox
  name: breeding mount blind box
  description: A discreetly wrapped package with the text "BREEDING MOUNT QTY 1" printed in large lettering.
  components:
  - type: EntityTableContainerFill
    containers:
      contents: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: BreedingMounts
          rolls: 1
