  name: Patos crate
  description: Contains two Patos with four mags. Requires Armory access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: WeaponSubMachineGunPatos
          amount: 2
        - id: MagazinePistolHighCapacity
          amount: 4
