- type: trait
  id: HealingPlus
  name: trait-healing-plus-name
  description: trait-healing-plus-desc
  category: BonusPhysical
  cost: 4
  conflicts:
  - HealingMinus
  - HealingPlus2
  conditions:
  - !type:HasCompCondition
    component: BorgChassis
    invert: true
  - !type:OneOfSpeciesCondition # Presumably this is related to IPCs and Onis already being hella strong? On EE floof stamina damage was based on a mass contest, so it makes sense.
    invert: true
    species:
    - SlimePerson
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: PassiveDamage # Equal to slime person healing
      allowedStates:
      - Alive
      damageCap: 65
      damage:
        types:
          Heat: -0.14
        groups:
          Brute: -0.14

- type: trait
  id: HealingPlus2
  name: trait-healing-plus-2-name
  description: trait-healing-plus-2-desc
  category: BonusPhysical
  cost: 8
  conflicts:
  - HealingMinus
  - HealingPlus
  conditions:
  - !type:HasCompCondition
    component: BorgChassis
    invert: true
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: PassiveDamage
      allowedStates:
      - Alive
      damageCap: 65 # same as lower trait
      damage:
        types:
          Heat: -0.14 # same as lower trait
          Poison: -0.07 # not present in lower trait
        groups:
          Brute: -0.21 # increased 50% over lower trait

- type: trait
  id: HealingMinus
  name: trait-healing-minus-name
  description: trait-healing-minus-desc
  category: DisabilitiesPhysical
  cost: -1
  conflicts:
  - HealingPlus
  - HealingPlus2
  conditions:
  - !type:HasCompCondition
    component: BorgChassis
    invert: true
  effects:
  - !type:OverrideCompsEffect
    components:
    - type: PassiveDamage # Half of base, with 75% of the cap
      allowedStates:
      - Alive
      damageCap: 15
      damage:
        types:
          Heat: -0.03
        groups:
          Brute: -0.03
