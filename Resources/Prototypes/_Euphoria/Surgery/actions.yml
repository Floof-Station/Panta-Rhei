  id: insertVagina
  insert: Vagina

#State changing surgeries. Requires one that sets the condition to true, and one to false

#Torso Muscles
- type: surgeryAction
  parent: [retractionSurgery, averageSurgery]
  id: retractMusclesTorso
  description: surgery-muscle-retract
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: false
  effects:
    Torso:
      muscleRetracted: true

- type: surgeryAction
  parent: [retractionSurgery, averageSurgery]
  id: replaceMusclesTorso
  description: surgery-muscle-replace
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: true
  effects:
    Torso:
      muscleRetracted: false

#Torso Skin
- type: surgeryAction
  parent: [cuttingSurgery, shortSurgery]
  id: openSkinTorso
  description: surgery-skin-cut
  states:
    Torso:
      skinRetracted: false
  effects:
    Torso:
      skinRetracted: true

- type: surgeryAction
  parent: [sealingSurgery, shortSurgery]
  id: closeSkinTorso
  description: surgery-skin-cautery
  states:
    Torso:
      skinRetracted: true
  effects:
    Torso:
      skinRetracted: false

#Torso Bones
- type: surgeryAction
  parent: [drillingSurgery, longSurgery]
  id: moveBonesTorso
  description: surgery-bone-drill
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: true
      boneRetracted: false
  effects:
    Torso:
      boneRetracted: true

- type: surgeryAction
  parent: [torsoOrganAccessState, retractionSurgery, averageSurgery]
  id: replaceBonesTorso
  description: surgery-bone-replace
  effects:
    Torso:
      boneRetracted: false

#Head skin
- type: surgeryAction
  parent: [cuttingSurgery, shortSurgery]
  id: openSkinHead
  description: surgery-skin-cut
  states:
    Head:
      skinRetracted: false
  effects:
    Head:
      skinRetracted: true

- type: surgeryAction
  parent: [sealingSurgery, shortSurgery]
  id: closeSkinHead
  description: surgery-skin-cautery
  states:
    Head:
      skinRetracted: true
  effects:
    Head:
      skinRetracted: false

#Head bone
- type: surgeryAction
  parent: [sawingSurgery, longSurgery]
  id: moveBonesHead
  description: surgery-bone-saw
  states:
    Head:
      skinRetracted: true
      boneRetracted: false
  effects:
    Head:
      boneRetracted: true

- type: surgeryAction
  parent: [sawingSurgery, longSurgery]
  id: replaceBonesHead
  description: surgery-bone-replace
  states:
    Head:
      skinRetracted: true
      boneRetracted: true
  effects:
    Head:
      boneRetracted: false

#Slime stuff
- type: surgeryAction
  parent: [cuttingSurgery, shortSurgery]
  id: slimeBypassedTorso
  description: surgery-slime-bypass
  states:
    Torso:
      slimeBypassed: false
  effects:
    Torso:
      slimeBypassed: true

- type: surgeryAction
  parent: [sealingSurgery, shortSurgery]
  id: slimeSolidifiedTorso
  description: surgery-slime-solidify
  states:
    Torso:
      slimeBypassed: true
  effects:
    Torso:
      slimeBypassed: false

- type: surgeryAction
  parent: [retractionSurgery, shortSurgery]
  id: removeCore
  description: surgery-slime-core-remove
  states:
    Torso:
      slimeBypassed: true
  remove: Brain

- type: surgeryAction
  parent: [sealingSurgery, shortSurgery]
  id: insertCore
  description: surgery-slime-core-insert
  states:
    Torso:
      slimeBypassed: true
  effects:
    Torso:
      slimeBypassed: false
  insert: Brain

- type: surgeryAction
  parent: [retractionSurgery, shortSurgery]
  id: removeSacs
  description: surgery-slime-sac-remove
  states:
    Torso:
      slimeBypassed: true
  remove: Lungs

- type: surgeryAction
  parent: [sealingSurgery, shortSurgery]
  id: insertSacs
  description: surgery-slime-sac-insert
  states:
    Torso:
      slimeBypassed: true
  effects:
    Torso:
      slimeBypassed: false
  insert: Lungs
