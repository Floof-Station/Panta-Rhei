#Times for surgeries
- type: surgeryAction
  abstract: true
  id: longSurgery
  duration: 60

- type: surgeryAction
  abstract: true
  id: averageSurgery
  duration: 30

- type: surgeryAction
  abstract: true
  id: shortSurgery
  duration: 10

- type: surgeryAction
  abstract: true
  id: treatmentSurgery
  duration: 2

#surgery common descriptions
- type: surgeryAction
  abstract: true
  id: removeOrgan
  description: surgery-remove-organ

- type: surgeryAction
  abstract: true
  id: insertOrgan
  description: surgery-insert-organ

#abstract common states
- type: surgeryAction
  abstract: true
  id: torsoOrganAccessState
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: true
      boneRetracted: true

- type: surgeryAction
  abstract: true
  id: torsoPlasticSurgeryStates
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: true

#Icons and types of surgeries to inherit from
- type: surgeryAction
  abstract: true
  id: cuttingSurgery
  toolType: Cutting
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: surgeryAction
  abstract: true
  id: retractionSurgery
  toolType: Retracting
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/scissors.rsi
    state: hemostat

- type: surgeryAction
  abstract: true
  id: sealingSurgery
  toolType: Cauterising
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: surgeryAction
  abstract: true
  id: sawingSurgery
  toolType: Sawing
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/saw.rsi
    state: saw

- type: surgeryAction
  abstract: true
  id: drillingSurgery
  toolType: Drilling
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/drill.rsi
    state: drill

#Actual Surgery Actions

#Damage repair surgeries
- type: surgeryAction
  parent: [retractionSurgery, treatmentSurgery]
  id: treatBurns
  description: surgery-treat-burns
  states:
    Torso:
      skinRetracted: true
    Head:
      skinRetracted: true
  treatment: Heat

#Brain surgery
- type: surgeryAction
  parent: [cuttingSurgery, longSurgery, removeOrgan]
  id: removeBrain
  states:
    Head:
      skinRetracted: true
      boneRetracted: true
  remove: Brain

- type: surgeryAction
  parent: [retractionSurgery, longSurgery, insertOrgan]
  id: insertBrain
  states:
    Head:
      skinRetracted: true
      boneRetracted: true
  insert: Brain

#Heart surgery
- type: surgeryAction
  parent: [torsoOrganAccessState, cuttingSurgery, averageSurgery, removeOrgan]
  id: removeHeart
  remove: Heart

- type: surgeryAction
  parent: [torsoOrganAccessState, sealingSurgery, averageSurgery, insertOrgan]
  id: insertHeart
  insert: Heart

#Lung surgery
- type: surgeryAction
  parent: [torsoOrganAccessState, cuttingSurgery, averageSurgery, removeOrgan]
  id: removeLungs
  remove: Lungs

- type: surgeryAction
  parent: [torsoOrganAccessState, sealingSurgery, averageSurgery, insertOrgan]
  id: insertLungs
  insert: Lungs

