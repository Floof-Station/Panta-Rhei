#Times for surgeries
- type: surgeryAction
  abstract: true
  id: longSurgery
  duration: 60

- type: surgeryAction
  abstract: true
  id: averageSurgery
  duration: 30

- type: surgeryAction
  abstract: true
  id: shortSurgery
  duration: 10

#abstract common states
- type: surgeryAction
  abstract: true
  id: torsoOrganAccessState
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: true
      boneRetracted: true

#Icons and types of surgeries to inherit from
- type: surgeryAction
  abstract: true
  id: cuttingSurgery
  toolType: Cutting
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel

- type: surgeryAction
  abstract: true
  id: retractionSurgery
  toolType: Retracting
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/scissors.rsi
    state: hemostat

- type: surgeryAction
  abstract: true
  id: sealingSurgery
  toolType: Cauterising
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: surgeryAction
  abstract: true
  id: sawingSurgery
  toolType: Sawing
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/saw.rsi
    state: saw

- type: surgeryAction
  abstract: true
  id: drillingSurgery
  toolType: Drilling
  icon:
    sprite: /Textures/Objects/Specific/Medical/Surgery/drill.rsi
    state: drill

#Actual Surgery Actions

#Heart surgery
- type: surgeryAction
  parent: [torsoOrganAccessState, cuttingSurgery, averageSurgery]
  id: removeHeart
  remove: Heart

- type: surgeryAction
  parent: [torsoOrganAccessState, sealingSurgery, averageSurgery]
  id: insertHeart
  insert: Heart

#Lung surgery
- type: surgeryAction
  parent: [torsoOrganAccessState, cuttingSurgery, averageSurgery]
  id: removeLungs
  remove: Lungs

- type: surgeryAction
  parent: [torsoOrganAccessState, sealingSurgery, averageSurgery]
  id: insertLungs
  insert: Lungs

#Stomach surgery
- type: surgeryAction
  parent: [torsoOrganAccessState, cuttingSurgery, averageSurgery]
  id: removeStomach
  remove: Stomach

- type: surgeryAction
  parent: [torsoOrganAccessState, sealingSurgery, averageSurgery]
  id: insertStomach
  insert: Stomach

#State changing surgeries. Requires one that sets the condition to true, and one to false

#Torso Muscles
- type: surgeryAction
  parent: [retractionSurgery, averageSurgery]
  id: retractMusclesTorso
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: false
  effects:
    Torso:
      muscleRetracted: true

- type: surgeryAction
  parent: [retractionSurgery, averageSurgery]
  id: replaceMusclesTorso
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: true
  effects:
    Torso:
      muscleRetracted: false

#Torso Skin
- type: surgeryAction
  parent: [cuttingSurgery, shortSurgery]
  id: openSkinTorso
  states:
    Torso:
      skinRetracted: false
  effects:
    Torso:
      skinRetracted: true

- type: surgeryAction
  parent: [sealingSurgery, shortSurgery]
  id: closeSkinTorso
  states:
    Torso:
      skinRetracted: true
  effects:
    Torso:
      skinRetracted: false

#Torso Bones
- type: surgeryAction
  parent: [drillingSurgery, longSurgery]
  id: moveBonesTorso
  states:
    Torso:
      skinRetracted: true
      muscleRetracted: true
      boneRetracted: false
  effects:
    Torso:
      boneRetracted: true

- type: surgeryAction
  parent: [torsoOrganAccessState, retractionSurgery, averageSurgery]
  id: replaceBonesTorso
  effects:
    Torso:
      boneRetracted: false
