  parent: [torsoOrganAccessState, cuttingSurgery, averageSurgery, removeOrgan]
  id: removeAppendix
  remove: Appendix

- type: surgeryAction
  parent: [torsoOrganAccessState, sealingSurgery, averageSurgery, insertOrgan]
  id: insertAppendix
  insert: Appendix

#Breasts surgery
- type: surgeryAction
  parent: [torsoPlasticSurgeryStates, cuttingSurgery, averageSurgery, removeOrgan]
  id: removeBreasts
  remove: MammaryGlands

- type: surgeryAction
  parent: [torsoPlasticSurgeryStates, sealingSurgery, averageSurgery, insertOrgan]
  id: insertBreasts
  insert: MammaryGlands

#Penis surgery
