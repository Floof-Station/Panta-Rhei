# Security
# NiKa
- type: borgType
  id: nikaborgsecurity
  # Description
  dummyPrototype: NikaChassisSecurity
  # Functional
  extraModuleCount: 2
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurity
  defaultModules:
  - BorgModuleSecurityDeescalate
  - BorgModuleSecurityPatrol
  lawset: SiliconPolice
  job: SecurityOfficer
  addComponents:
  - type: FlashImmunity
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: Fiber # red plasteel fibers
    fiberMaterial: fibers-plasteel
    fiberColor: fibers-red
