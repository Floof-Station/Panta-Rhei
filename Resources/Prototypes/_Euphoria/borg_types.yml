# Generic NiKa borg
- type: borgType
  id: nikaborggeneric
  # Description
  dummyPrototype: NikaChassisGeneric
  # Functional
  extraModuleCount: 5
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
  defaultModules:
  - BorgModuleTool
  - BorgModuleInflatable
  - BorgModuleArtifact
  - BorgModuleAnomaly
  radioChannels:
  - Science
  # Visual
  clientComponents:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Euphoria/Mobs/Silicon/chassis.rsi
    layers:
    - state: nikagen
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: nika_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: nikagen_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
  inventoryTemplateId: borgShort
  spriteBodyState: nikagen
  spriteHasMindState: nikagen_e
  spriteNoMindState: nika_e_r
  spriteToggleLightState: nikagen_l
  # Pet
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg
